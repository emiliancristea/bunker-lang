name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: rustup default ${{ matrix.rust }}

      - name: Build
        working-directory: bunker-cli
        run: cargo build --verbose

      - name: Run Rust tests
        working-directory: bunker-cli
        run: cargo test --verbose

      - name: Build release
        working-directory: bunker-cli
        run: cargo build --release --verbose

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: bunker-cli-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            bunker-cli/target/release/bunker-cli
            bunker-cli/target/release/bunker-cli.exe

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        working-directory: bunker-cli
        run: cargo fmt -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        working-directory: bunker-cli
        run: cargo clippy -- -D warnings

  bunker-tests:
    name: Bunker language tests
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Build release compiler
        working-directory: bunker-cli
        run: cargo build --release

      - name: Run Bunker test suite
        shell: pwsh
        run: ./run_tests.ps1 -Verbose

  self-host-boundaries:
    name: Self-host boundary guards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Prevent raw AST collection traversal outside AST boundary
        shell: bash
        run: |
          set -euo pipefail
          pattern='ast_kernel_item_count\(|ast_kernel_item\(|ast_fn_param_count\(|ast_fn_param\(|ast_struct_field_count\(|ast_struct_field\(|ast_call_arg_count\(|ast_call_arg_handle\(|ast_array_element_count\(|ast_array_element_handle\(|ast_match_arm_count\(|ast_match_body_handle\(|ast_struct_lit_field_count\(|ast_struct_lit_field_name_idx\(|ast_struct_lit_field_value_handle\(|ast_pattern_list_get_ref\(ast_match_patterns|ast_node_list_get_ref\(ast_fn_params\(|ast_node_list_get_ref\(ast_struct_fields\('
          matches="$(mktemp)"
          grep -R -n -E "$pattern" self-host --include='*.bkr' | grep -v '^self-host/modules/ast\.bkr:' > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Raw AST collection traversal must stay inside self-host/modules/ast.bkr."
            cat "$matches"
            exit 1
          fi

      - name: Require NodeKind enum-backed AST tags
        shell: bash
        run: |
          set -euo pipefail
          constants='self-host/modules/constants.bkr'
          grep -q 'enum NodeKind {' "$constants"
          grep -q 'const NODE_FN: i64 = NodeKind.Fn;' "$constants"
          grep -q 'const NODE_ENUM: i64 = NodeKind.Enum;' "$constants"
          ! grep -q 'const NODE_FN: i64 = 2;' "$constants"

      - name: Require TokenKind enum-backed lexer tags
        shell: bash
        run: |
          set -euo pipefail
          constants='self-host/modules/constants.bkr'
          grep -q 'enum TokenKind {' "$constants"
          grep -q 'const TOK_EOF: i64 = TokenKind.Eof;' "$constants"
          grep -q 'const TOK_FN: i64 = TokenKind.Fn;' "$constants"
          grep -q 'const TOK_FAT_ARROW: i64 = TokenKind.FatArrow;' "$constants"
          ! grep -q 'const TOK_FN: i64 = 23;' "$constants"

      - name: Require PatternKind and TypeKind enum-backed tags
        shell: bash
        run: |
          set -euo pipefail
          constants='self-host/modules/constants.bkr'
          grep -q 'enum PatternKind {' "$constants"
          grep -q 'const PAT_INT: i64 = PatternKind.Int;' "$constants"
          grep -q 'const PAT_ENUM_VARIANT: i64 = PatternKind.EnumVariant;' "$constants"
          grep -q 'enum TypeKind {' "$constants"
          grep -q 'const TYPE_I32: i64 = TypeKind.I32;' "$constants"
          grep -q 'const TYPE_STRUCT: i64 = TypeKind.Struct;' "$constants"
          grep -q 'const TYPE_UNKNOWN: i64 = 99;' "$constants"
          ! grep -q 'const PAT_INT: i64 = 1;' "$constants"
          ! grep -q 'const TYPE_I32: i64 = 0;' "$constants"

      - name: Require NodeKind-typed AST kind APIs
        shell: bash
        run: |
          set -euo pipefail
          kind_model='self-host/modules/kind_model.bkr'
          ast='self-host/modules/ast.bkr'
          grep -q 'fn ast_node_kind_name(kind: NodeKind) -> str' "$kind_model"
          grep -q 'fn ast_node_category_kind(kind: NodeKind) -> i64' "$kind_model"
          grep -q 'fn ast_is_item_kind(kind: NodeKind) -> bool' "$kind_model"
          grep -q 'fn ast_node_ref_new(kind: NodeKind) -> AstNodeRef' "$ast"
          grep -q 'fn ast_node_kind(node: Vec<i64>) -> NodeKind' "$ast"
          grep -q 'fn ast_node_ref_kind(node_ref: AstNodeRef) -> NodeKind' "$ast"
          grep -q 'fn ast_expr_ref_kind(expr_ref: AstExprRef) -> NodeKind' "$ast"
          grep -q 'fn ast_stmt_ref_kind(stmt_ref: AstStmtRef) -> NodeKind' "$ast"
          grep -q 'fn ast_item_ref_kind(item_ref: AstItemRef) -> NodeKind' "$ast"
          ! grep -q 'fn ast_node_kind_name(kind: i64)' "$kind_model"
          ! grep -q 'fn ast_node_ref_kind(node_ref: AstNodeRef) -> i64' "$ast"

      - name: Require TokenKind-typed lexer APIs
        shell: bash
        run: |
          set -euo pipefail
          kind_model='self-host/modules/kind_model.bkr'
          parser='self-host/modules/parser.bkr'
          parser_state='self-host/modules/parser_state.bkr'
          lexer='self-host/modules/lexer.bkr'
          grep -q 'fn token_kind_name(kind: TokenKind) -> str' "$kind_model"
          grep -q 'fn token_is_name_kind(kind: TokenKind) -> bool' "$kind_model"
          grep -q 'fn token_name(tok: TokenKind) -> str' "$parser"
          grep -q 'fn is_name_token(tok: TokenKind) -> bool' "$parser"
          grep -q 'fn parser_peek_ref(p_ref: ParserStateRef) -> TokenKind' "$parser_state"
          grep -q 'fn parser_expect_ref(p_ref: ParserStateRef, expected: TokenKind) -> bool' "$parser_state"
          grep -q 'fn parser_error_expected_ref(p_ref: ParserStateRef) -> TokenKind' "$parser_state"
          grep -q 'fn parse_insert_text_for_expected_token(expected_token: TokenKind) -> str' 'self-host/modules/driver.bkr'
          grep -q 'let tok_type: TokenKind =' "$lexer"
          ! grep -q 'fn token_kind_name(kind: i64)' "$kind_model"
          ! grep -q 'fn token_name(tok: i64)' "$parser"
          ! grep -q 'fn parser_peek_ref(p_ref: ParserStateRef) -> i64' "$parser_state"
          ! grep -q 'fn parse_insert_text_for_expected_token(expected_token: i64)' 'self-host/modules/driver.bkr'

      - name: Require PatternKind and TypeKind typed APIs
        shell: bash
        run: |
          set -euo pipefail
          kind_model='self-host/modules/kind_model.bkr'
          ast='self-host/modules/ast.bkr'
          typecheck='self-host/modules/typecheck.bkr'
          c_codegen='self-host/modules/c_codegen.bkr'
          grep -q 'fn ast_type_kind_name(kind: TypeKind) -> str' "$kind_model"
          grep -q 'fn ast_pattern_kind_name(kind: PatternKind) -> str' "$kind_model"
          grep -q 'fn ast_pattern_ref_new(kind: PatternKind, value: i64) -> AstPatternRef' "$ast"
          grep -q 'fn ast_pattern_ref_kind(pattern_ref: AstPatternRef) -> PatternKind' "$ast"
          grep -q 'fn ast_pattern_kind(pattern: Vec<i64>) -> PatternKind' "$ast"
          grep -q 'fn ast_type_ref(kind: TypeKind) -> AstTypeRef' "$ast"
          grep -q 'fn ast_type_ref_kind_value(type_ref: AstTypeRef) -> TypeKind' "$ast"
          grep -q 'fn ast_type_kind_value(type_node: i64) -> TypeKind' "$ast"
          grep -q 'fn typecheck_is_integer_kind(kind: TypeKind) -> bool' "$typecheck"
          grep -q 'fn type_to_c(kind: TypeKind) -> str' "$c_codegen"
          grep -q 'const TYPE_UNKNOWN: i64 = 99;' 'self-host/modules/constants.bkr'
          ! grep -q 'fn ast_type_kind_name(kind: i64)' "$kind_model"
          ! grep -q 'fn ast_pattern_kind_name(kind: i64)' "$kind_model"
          ! grep -q 'fn ast_pattern_ref_kind(pattern_ref: AstPatternRef) -> i64' "$ast"
          ! grep -q 'fn ast_type_ref_kind_value(type_ref: AstTypeRef) -> i64' "$ast"
          ! grep -q 'fn typecheck_is_integer_kind(kind: i64)' "$typecheck"
          ! grep -q 'fn type_to_c(kind: i64)' "$c_codegen"

      - name: Require recursive self-host import expansion
        shell: bash
        run: |
          set -euo pipefail
          driver='self-host/modules/driver.bkr'
          grep -q 'fn import_seen_contains(seen: Vec<str>, import_path: str) -> bool' "$driver"
          grep -q 'fn expand_imports_with_seen(source: str, seen: Vec<str>, base_dir: str) -> str' "$driver"
          grep -q 'fn first_missing_import_path_with_seen(source: str, seen: Vec<str>, base_dir: str) -> str' "$driver"
          grep -q 'let expanded_import = expand_imports_with_seen(imported, seen, import_path_dir(resolved_path));' "$driver"
          grep -q 'return first_missing_import_path_with_seen(read_file(resolved_path), seen, import_path_dir(resolved_path));' "$driver"

      - name: Require self-host import graph report
        shell: bash
        run: |
          set -euo pipefail
          driver='self-host/modules/driver.bkr'
          grep -q 'fn self_host_import_graph_json(source: str) -> str' "$driver"
          grep -q 'fn self_host_import_graph_json_with_base_dir(source: str, base_dir: str) -> str' "$driver"
          grep -q 'BUNKER_IMPORT_GRAPH_JSON' "$driver"
          grep -q 'json_field_str("root_base_dir", base_dir)' "$driver"
          grep -q 'json_field_i64("unique_import_count", unique_import_count_from_base(source, base_dir))' "$driver"
          grep -q 'fn import_edge_status_count_in_json(edges_json: str, status: str) -> i64' "$driver"
          grep -q 'fn import_edge_count_from_base(source: str, base_dir: str) -> i64' "$driver"
          grep -q 'json_field_i64("edge_count", import_edge_count_from_base(source, base_dir))' "$driver"
          grep -q 'json_field_i64("ok_edge_count", import_edge_status_count_from_base(source, base_dir, "ok"))' "$driver"
          grep -q 'json_field_i64("missing_edge_count", import_edge_status_count_from_base(source, base_dir, "missing"))' "$driver"
          grep -q 'json_field_i64("invalid_edge_count", import_edge_status_count_from_base(source, base_dir, "invalid"))' "$driver"
          grep -q 'json_field_i64("duplicate_edge_count", import_edge_status_count_from_base(source, base_dir, "duplicate"))' "$driver"
          grep -q 'json_field_raw("imports", unique_import_paths_json_from_base(source, base_dir))' "$driver"
          grep -q 'json_field_raw("edges", import_edges_json_from_base(source, base_dir))' "$driver"
          grep -q 'fn import_edge_json(from_base: str, requested: str, resolved: str, status: str) -> str' "$driver"
          grep -q 'json_field_bool("import_graph_report", true)' "$driver"
          grep -q 'json_field_bool("import_duplicate_or_cycle_summary", true)' "$driver"
          grep -q 'json_field_bool("cycle_safe_expansion", true)' "$driver"
          grep -q 'json_field_i64("duplicate_or_cycle_edge_count", import_edge_status_count_from_base(source, base_dir, "duplicate"))' "$driver"
          grep -q 'json_field_bool("has_duplicate_or_cycle_import", import_edge_status_count_from_base(source, base_dir, "duplicate") > 0)' "$driver"
          grep -q 'capability_report + import_graph_report + ast_report' "$driver"

      - name: Require diagnostic source excerpts
        shell: bash
        run: |
          set -euo pipefail
          driver='self-host/modules/driver.bkr'
          grep -q 'fn source_line_excerpt_at(source: str, offset: i64) -> str' "$driver"
          grep -q 'json_field_bool("source_excerpts", true)' "$driver"
          grep -q 'json_field_str("source_excerpt", source_excerpt)' "$driver"
          grep -q 'json_field_bool("structured_repair_metadata", true)' "$driver"
          grep -q 'json_field_str("suggested_action", repair_hint)' "$driver"
          grep -q 'json_field_str("fix_applicability", "manual_review")' "$driver"
          grep -q 'json_field_str("fix_confidence", "medium")' "$driver"
          grep -q 'fn self_host_diagnostic_codes_json() -> str' "$driver"
          grep -q 'json_field_bool("diagnostic_code_registry", true)' "$driver"
          grep -q 'json_field_str("agent_contract_version", "bunker.agent.diagnostics.v1")' "$driver"
          grep -q 'json_field_str("self_hosting_stage", "bootstrap-self-hosted-reports")' "$driver"
          grep -q 'json_field_bool("ai_agent_native_diagnostics", true)' "$driver"
          grep -q 'json_field_bool("production_language_ready", false)' "$driver"
          grep -q 'json_field_bool("requires_ci_validation", true)' "$driver"
          grep -q 'json_field_bool("diagnostic_phase_field", true)' "$driver"
          grep -q 'json_field_bool("diagnostic_rule_ids", true)' "$driver"
          grep -q 'json_field_bool("diagnostic_severity", true)' "$driver"
          grep -q 'json_field_bool("diagnostic_severity_counts", true)' "$driver"
          grep -q 'json_field_str("phase", category)' "$driver"
          grep -q 'json_field_str("rule_id", code)' "$driver"
          grep -q 'json_field_str("severity", "error")' "$driver"
          grep -q 'json_field_bool("suggested_edit_envelope", true)' "$driver"
          grep -q 'fn diagnostic_text_edit_json(kind: str, source_start: i64, source_end: i64,' 'self-host/modules/report_support.bkr'
          grep -q 'json_field_raw("suggested_edits", suggested_edits)' "$driver"
          grep -q 'fn parse_insert_text_for_expected_token(expected_token: TokenKind) -> str' "$driver"
          grep -q 'json_field_raw("diagnostic_codes", self_host_diagnostic_codes_json())' "$driver"
          grep -q 'BKR_SELF_ASSIGNMENT_TARGET' "$driver"
          grep -q 'BKR_SELF_CONTROL_FLOW' "$driver"
          grep -q 'BKR_SELF_RETURN_PATH' "$driver"
          grep -q 'BKR_SELF_UNREACHABLE_CODE' "$driver"
          grep -q 'BKR_SELF_MATCH_PATTERN' "$driver"
          grep -q 'BKR_SELF_EXHAUSTIVENESS' "$driver"
          grep -q 'BKR_SELF_STRUCT_LITERAL' "$driver"
          grep -q 'BKR_SELF_CONST_ASSIGNMENT' "$driver"
          grep -q 'BKR_SELF_AMBIGUOUS_TYPE' "$driver"
          grep -q 'BKR_SELF_VOID_VALUE' "$driver"
          grep -q 'BKR_SELF_ENTRY_POINT' "$driver"
          grep -q 'BKR_SELF_CALL_TARGET' "$driver"
          grep -q 'let source_excerpt = source_line_excerpt_at(source, source_start);' "$driver"

      - name: Require self-host import path policy
        shell: bash
        run: |
          set -euo pipefail
          driver='self-host/modules/driver.bkr'
          grep -q 'fn import_path_is_valid(import_path: str) -> bool' "$driver"
          grep -q 'fn first_invalid_import_path(source: str) -> str' "$driver"
          grep -q 'fn build_import_path_diagnostic(invalid_import: str) -> str' "$driver"
          grep -q 'BKR_SELF_IMPORT_PATH' "$driver"
          grep -q 'json_field_str("path_policy", "normalized_relative_forward_slash")' "$driver"
          grep -q 'json_field_bool("has_invalid_import", len(invalid_import) > 0)' "$driver"
          grep -q 'compile_to_c:invalid_import' "$driver"

      - name: Require importer-directory import resolution
        shell: bash
        run: |
          set -euo pipefail
          driver='self-host/modules/driver.bkr'
          grep -q 'fn resolve_import_path(base_dir: str, import_path: str) -> str' "$driver"
          grep -q 'fn import_path_dir(resolved_path: str) -> str' "$driver"
          grep -q 'fn expand_imports_with_seen(source: str, seen: Vec<str>, base_dir: str) -> str' "$driver"
          grep -q 'resolve_import_path(base_dir, import_path)' "$driver"
          grep -q 'import_path_dir(resolved_path)' "$driver"
          grep -q 'json_field_bool("base_directory_resolution", true)' "$driver"
          grep -q 'fn compile_to_c_with_base_dir(source: str, root_base_dir: str) -> str' "$driver"
          grep -q 'expand_imports_from_base(source, root_base_dir)' "$driver"

      - name: Require parser start spans through typed AST refs
        shell: bash
        run: |
          set -euo pipefail
          parser='self-host/modules/parser.bkr'
          ast='self-host/modules/ast.bkr'
          grep -q 'fn parser_set_node_ref_span_from_start(p: ParserStateRef, node_ref: AstNodeRef, start: i64) -> AstNodeRef' "$parser"
          grep -q 'fn parser_set_node_ref_span(node_ref: AstNodeRef, start: i64, end: i64) -> AstNodeRef' "$parser"
          grep -q 'fn parser_set_type_ref_span_from_start(p: ParserStateRef, type_ref: AstTypeRef, start: i64) -> AstTypeRef' "$parser"
          grep -q 'fn parser_set_expr_ref_span_from_start(p: ParserStateRef, expr_ref: AstExprRef, start: i64) -> AstExprRef' "$parser"
          grep -q 'fn parser_set_expr_ref_span(expr_ref: AstExprRef, start: i64, end: i64) -> AstExprRef' "$parser"
          grep -q 'fn parser_set_stmt_ref_span_from_start(p: ParserStateRef, stmt_ref: AstStmtRef, start: i64) -> AstStmtRef' "$parser"
          grep -q 'fn parser_set_stmt_ref_span(stmt_ref: AstStmtRef, start: i64, end: i64) -> AstStmtRef' "$parser"
          grep -q 'fn parser_set_item_ref_span_from_start(p: ParserStateRef, item_ref: AstItemRef, start: i64) -> AstItemRef' "$parser"
          grep -q 'fn parser_set_block_ref_span_from_start(p: ParserStateRef, block_ref: AstBlockRef, start: i64) -> AstBlockRef' "$parser"
          grep -q 'fn parser_set_pattern_ref_span_from_start(p: ParserStateRef, pattern_ref: AstPatternRef, start: i64) -> AstPatternRef' "$parser"
          matches="$(mktemp)"
          grep -n -E 'return ast_set_span\(node, start, parser_end_for_span|return ast_set_pattern_span\(pattern, start, parser_end_for_span' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser start-span adapters must route through typed AstNodeRef/AstPatternRef helpers."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'parser_set_node_span_from_start\(p, ast_(type|type_array|type_struct|match|int_lit|float_lit|bool_lit|str_lit|array_lit|struct_lit|call|ident|unary)\(|parser_set_pattern_span_from_start\(p, ast_pattern\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser primary/type/pattern construction must route through typed Ast*Ref constructors."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'ast_(index|field_access|binary|ternary|assign|expr_stmt)\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser postfix/operator/assignment construction must route through typed Ast*Ref constructors."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'parser_set_node_span_from_start\(p, ast_(let|return|break|continue)\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser simple-statement construction must route through typed AstStmtRef constructors."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'ast_(if|for|while|loop)\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser control-flow construction must route through typed AstStmtRef constructors."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'ast_(param|field_decl)\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser param/field construction must route through typed AstNodeRef constructors."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'parser_set_node_span_from_start\(p, ast_(fn|const|struct)\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser item construction must route through typed AstItemRef constructors."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'parser_set_node_span_from_start\(p, ast_kernel\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser kernel construction must route through typed AstNodeRef constructors."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn ast_node_list_append_expr_ref(nodes_ref: AstNodeListRef, expr_ref: AstExprRef) -> AstNodeListRef' "$ast"
          grep -q 'fn ast_node_list_append_item_ref(nodes_ref: AstNodeListRef, item_ref: AstItemRef) -> AstNodeListRef' "$ast"
          grep -n -E 'ast_node_list_append\(|ast_node_list_append_ref\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser node-list appends must use typed AST node-list append refs."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'ast_block\(|ast_block_append\(|ast_block_with\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser block construction must route through typed AstBlockRef helpers."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'ast_block_(ref_from_node|handle)\(parse_block\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser block consumers must use parse_block_ref instead of raw parse_block adapters."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'ast_stmt_ref_from_node\(parse_(let|return|simple|if|for)_stmt\(|let [A-Za-z0-9_]+: Vec<i64> = parse_(let|return|simple|if|for)_stmt\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser statement consumers must use parse_*_stmt_ref helpers instead of raw statement wrappers."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parse_params_ref(p: ParserStateRef) -> AstNodeListRef' "$parser"
          grep -q 'fn parse_fn_ref(p: ParserStateRef) -> AstItemRef' "$parser"
          grep -q 'fn parse_const_ref(p: ParserStateRef) -> AstItemRef' "$parser"
          grep -q 'fn parse_struct_ref(p: ParserStateRef) -> AstItemRef' "$parser"
          grep -n -E 'parse_params\(p\);|parse_(fn|const|struct)\(p\);|let [A-Za-z0-9_]+: Vec<i64> = parse_(params|fn|const|struct)\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser param/item consumers must use typed parse_*_ref helpers instead of raw wrappers."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parse_expr_ref(p: ParserStateRef) -> AstExprRef' "$parser"
          grep -n -E 'parse_expr\(p\);|ast_expr_ref_from_node\(parse_expr\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser expression consumers must use parse_expr_ref instead of raw parse_expr nodes."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parse_type_ref(p: ParserStateRef) -> AstTypeRef' "$parser"
          grep -n -E 'parse_type\(p\);|ast_type_ref_from_node\(parse_type\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser type consumers must use parse_type_ref instead of raw parse_type nodes."
            cat "$matches"
            exit 1
          fi
