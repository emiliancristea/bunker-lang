name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Build
        working-directory: bunker-cli
        run: cargo build --verbose

      - name: Run Rust tests
        working-directory: bunker-cli
        run: cargo test --verbose

      - name: Build release
        working-directory: bunker-cli
        run: cargo build --release --verbose

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: bunker-cli-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            bunker-cli/target/release/bunker-cli
            bunker-cli/target/release/bunker-cli.exe

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        working-directory: bunker-cli
        run: cargo fmt -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        working-directory: bunker-cli
        run: cargo clippy -- -D warnings

  bunker-tests:
    name: Bunker language tests
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Build release compiler
        working-directory: bunker-cli
        run: cargo build --release

      - name: Run Bunker test suite
        shell: pwsh
        run: ./run_tests.ps1 -Verbose

  self-host-incremental:
    name: Self-host incremental inputs
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Build release compiler
        working-directory: bunker-cli
        run: cargo build --release

      - name: Compile incremental parser fixture
        timeout-minutes: 4
        run: |
          timeout 210s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/99_incremental_1.bkr \
            -o /tmp/99_incremental_1.c

      - name: Compile incremental codegen fixture
        timeout-minutes: 4
        run: |
          timeout 210s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/99_incremental_2.bkr \
            -o /tmp/99_incremental_2.c
