name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: rustup default ${{ matrix.rust }}

      - name: Build
        working-directory: bunker-cli
        run: cargo build --verbose

      - name: Run Rust tests
        working-directory: bunker-cli
        run: cargo test --verbose

      - name: Build release
        working-directory: bunker-cli
        run: cargo build --release --verbose

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: bunker-cli-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            bunker-cli/target/release/bunker-cli
            bunker-cli/target/release/bunker-cli.exe

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        working-directory: bunker-cli
        run: cargo fmt -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        working-directory: bunker-cli
        run: cargo clippy -- -D warnings

  bunker-tests:
    name: Bunker language tests
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Build release compiler
        working-directory: bunker-cli
        run: cargo build --release

      - name: Run Bunker test suite
        shell: pwsh
        run: ./run_tests.ps1 -Verbose

  self-host-smoke:
    name: Self-host smoke inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Build release compiler
        working-directory: bunker-cli
        run: cargo build --release

      - name: Check self-host compiler sources
        timeout-minutes: 2
        run: ./bunker-cli/target/release/bunker-cli self-host-check self-host

      - name: Compile basic fixture through self-host compiler
        timeout-minutes: 2
        run: |
          timeout --kill-after=5s 60s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/01_basic_math.bkr \
            -o /tmp/01_basic_math.c
          test -s /tmp/01_basic_math.c

      - name: Compile branching fixture through self-host compiler
        timeout-minutes: 2
        run: |
          timeout --kill-after=5s 60s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/14_kernel_if_branching.bkr \
            -o /tmp/14_kernel_if_branching.c
          test -s /tmp/14_kernel_if_branching.c

      - name: Compile incremental parser fixture through self-host compiler
        timeout-minutes: 3
        run: |
          timeout --kill-after=5s 120s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/99_incremental_1.bkr \
            -o /tmp/99_incremental_1.c
          test -s /tmp/99_incremental_1.c
          ! grep -q "Parse error" /tmp/99_incremental_1.c

      - name: Compile incremental codegen fixture through self-host compiler
        timeout-minutes: 3
        run: |
          timeout --kill-after=5s 120s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/99_incremental_2.bkr \
            -o /tmp/99_incremental_2.c
          test -s /tmp/99_incremental_2.c
          ! grep -q "Parse error" /tmp/99_incremental_2.c

  self-host-incremental-canary:
    name: Self-host incremental canary
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Build release compiler
        working-directory: bunker-cli
        run: cargo build --release

      - name: Compile incremental parser fixture under resource caps
        timeout-minutes: 3
        run: |
          ulimit -v 1500000
          timeout --kill-after=5s 120s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/99_incremental_1.bkr \
            -o /tmp/99_incremental_1.c

      - name: Compile incremental codegen fixture under resource caps
        timeout-minutes: 3
        run: |
          ulimit -v 1500000
          timeout --kill-after=5s 120s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/99_incremental_2.bkr \
            -o /tmp/99_incremental_2.c
