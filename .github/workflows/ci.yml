name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: rustup default ${{ matrix.rust }}

      - name: Build
        working-directory: bunker-cli
        run: cargo build --verbose

      - name: Run Rust tests
        working-directory: bunker-cli
        run: cargo test --verbose

      - name: Build release
        working-directory: bunker-cli
        run: cargo build --release --verbose

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: bunker-cli-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            bunker-cli/target/release/bunker-cli
            bunker-cli/target/release/bunker-cli.exe

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        working-directory: bunker-cli
        run: cargo fmt -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        working-directory: bunker-cli
        run: cargo clippy -- -D warnings

  bunker-tests:
    name: Bunker language tests
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Build release compiler
        working-directory: bunker-cli
        run: cargo build --release

      - name: Run Bunker test suite
        shell: pwsh
        run: ./run_tests.ps1 -Verbose

  self-host-boundaries:
    name: Self-host boundary guards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Prevent raw AST collection traversal outside AST boundary
        shell: bash
        run: |
          set -euo pipefail
          pattern='ast_kernel_item_count\(|ast_kernel_item\(|ast_fn_param_count\(|ast_fn_param\(|ast_struct_field_count\(|ast_struct_field\(|ast_call_arg_count\(|ast_call_arg_handle\(|ast_array_element_count\(|ast_array_element_handle\(|ast_match_arm_count\(|ast_match_body_handle\(|ast_struct_lit_field_count\(|ast_struct_lit_field_name_idx\(|ast_struct_lit_field_value_handle\(|ast_pattern_list_get_ref\(ast_match_patterns|ast_node_list_get_ref\(ast_fn_params\(|ast_node_list_get_ref\(ast_struct_fields\('
          matches="$(mktemp)"
          grep -R -n -E "$pattern" self-host --include='*.bkr' | grep -v '^self-host/modules/ast\.bkr:' > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Raw AST collection traversal must stay inside self-host/modules/ast.bkr."
            cat "$matches"
            exit 1
          fi

      - name: Require parser start spans through typed AST refs
        shell: bash
        run: |
          set -euo pipefail
          parser='self-host/modules/parser.bkr'
          grep -q 'fn parser_set_node_ref_span_from_start(p: ParserStateRef, node_ref: AstNodeRef, start: i64) -> AstNodeRef' "$parser"
          grep -q 'fn parser_set_node_ref_span(node_ref: AstNodeRef, start: i64, end: i64) -> AstNodeRef' "$parser"
          grep -q 'fn parser_set_type_ref_span_from_start(p: ParserStateRef, type_ref: AstTypeRef, start: i64) -> AstTypeRef' "$parser"
          grep -q 'fn parser_set_expr_ref_span_from_start(p: ParserStateRef, expr_ref: AstExprRef, start: i64) -> AstExprRef' "$parser"
          grep -q 'fn parser_set_expr_ref_span(expr_ref: AstExprRef, start: i64, end: i64) -> AstExprRef' "$parser"
          grep -q 'fn parser_set_stmt_ref_span_from_start(p: ParserStateRef, stmt_ref: AstStmtRef, start: i64) -> AstStmtRef' "$parser"
          grep -q 'fn parser_set_stmt_ref_span(stmt_ref: AstStmtRef, start: i64, end: i64) -> AstStmtRef' "$parser"
          grep -q 'fn parser_set_item_ref_span_from_start(p: ParserStateRef, item_ref: AstItemRef, start: i64) -> AstItemRef' "$parser"
          grep -q 'fn parser_set_block_ref_span_from_start(p: ParserStateRef, block_ref: AstBlockRef, start: i64) -> AstBlockRef' "$parser"
          grep -q 'fn parser_set_pattern_ref_span_from_start(p: ParserStateRef, pattern_ref: AstPatternRef, start: i64) -> AstPatternRef' "$parser"
          matches="$(mktemp)"
          grep -n -E 'return ast_set_span\(node, start, parser_end_for_span|return ast_set_pattern_span\(pattern, start, parser_end_for_span' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser start-span adapters must route through typed AstNodeRef/AstPatternRef helpers."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'parser_set_node_span_from_start\(p, ast_(type|type_array|type_struct|match|int_lit|float_lit|bool_lit|str_lit|array_lit|struct_lit|call|ident|unary)\(|parser_set_pattern_span_from_start\(p, ast_pattern\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser primary/type/pattern construction must route through typed Ast*Ref constructors."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'ast_(index|field_access|binary|ternary|assign|expr_stmt)\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser postfix/operator/assignment construction must route through typed Ast*Ref constructors."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'parser_set_node_span_from_start\(p, ast_(let|return|break|continue)\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser simple-statement construction must route through typed AstStmtRef constructors."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'ast_(if|for|while|loop)\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser control-flow construction must route through typed AstStmtRef constructors."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'ast_(param|field_decl)\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser param/field construction must route through typed AstNodeRef constructors."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'parser_set_node_span_from_start\(p, ast_(fn|const|struct)\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser item construction must route through typed AstItemRef constructors."
            cat "$matches"
            exit 1
          fi

      - name: Require AST constructors through typed refs
        shell: bash
        run: |
          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          matches="$(mktemp)"
          grep -n -E 'let node: Vec<i64> = ast_new\(|return ast_new\(NODE_' "$ast" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "AST constructors must route through typed Ast*Ref helpers."
            cat "$matches"
            exit 1
          fi
          grep -n 'return ast_block_stmt_count(ast_block_node_from_ref(block_ref))' "$ast" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Typed block count helper must not recurse through the raw adapter."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'let node_ref = ast_node_ref_new|let block_ref = ast_block_ref|let stmt = ast_stmt_node_from_ref' "$ast" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Typed AST constructor locals must carry explicit types for stage2 codegen."
            cat "$matches"
            exit 1
          fi

  self-host-smoke:
    name: Self-host smoke inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Build release compiler
        working-directory: bunker-cli
        run: cargo build --release

      - name: Check self-host compiler sources
        timeout-minutes: 2
        run: ./bunker-cli/target/release/bunker-cli self-host-check self-host

      - name: Compile basic fixture through self-host compiler
        timeout-minutes: 2
        run: |
          timeout --kill-after=5s 60s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/01_basic_math.bkr \
            -o /tmp/01_basic_math.c
          test -s /tmp/01_basic_math.c
          grep -q "BUNKER_CAPABILITY_JSON" /tmp/01_basic_math.c
          grep -q "bunker.self_host.capability.v1" /tmp/01_basic_math.c
          grep -q '"source_byte_spans":true' /tmp/01_basic_math.c
          grep -q '"type_graph_report":true' /tmp/01_basic_math.c
          grep -q '"symbol_table_report":true' /tmp/01_basic_math.c
          grep -q '"name_resolver_report":true' /tmp/01_basic_math.c
          grep -q '"typecheck_report":true' /tmp/01_basic_math.c
          grep -q '"typed_ast":false' /tmp/01_basic_math.c
          grep -q "BUNKER_AST_JSON" /tmp/01_basic_math.c
          grep -q "bunker.self_host.ast.v1" /tmp/01_basic_math.c
          grep -q '"complete_tree":true' /tmp/01_basic_math.c
          grep -q '"tree":{"kind":"kernel"' /tmp/01_basic_math.c
          grep -q '"statements":' /tmp/01_basic_math.c
          grep -q '"return_type":' /tmp/01_basic_math.c
          grep -q '"item_count":2' /tmp/01_basic_math.c
          grep -q '"function_count":2' /tmp/01_basic_math.c
          grep -q "BUNKER_TYPE_GRAPH_JSON" /tmp/01_basic_math.c
          grep -q "bunker.self_host.type_graph.v1" /tmp/01_basic_math.c
          grep -q '"complete":false' /tmp/01_basic_math.c
          grep -q '"declared_types":true' /tmp/01_basic_math.c
          grep -q '"functions":' /tmp/01_basic_math.c
          grep -q '"locals":' /tmp/01_basic_math.c
          grep -q '"effective_type":' /tmp/01_basic_math.c
          grep -q "BUNKER_SYMBOL_TABLE_JSON" /tmp/01_basic_math.c
          grep -q "bunker.self_host.symbol_table.v1" /tmp/01_basic_math.c
          grep -q '"declaration_table":' /tmp/01_basic_math.c
          grep -q '"reference_table":' /tmp/01_basic_math.c
          grep -q '"resolver_report":"BUNKER_RESOLVER_JSON"' /tmp/01_basic_math.c
          grep -q '"kind":"function"' /tmp/01_basic_math.c
          grep -q '"kind":"local"' /tmp/01_basic_math.c
          grep -q '"kind":"function_call"' /tmp/01_basic_math.c
          grep -q "BUNKER_RESOLVER_JSON" /tmp/01_basic_math.c
          grep -q "bunker.self_host.resolver.v1" /tmp/01_basic_math.c
          grep -q '"duplicate_detection":true' /tmp/01_basic_math.c
          grep -q '"unresolved_detection":true' /tmp/01_basic_math.c
          grep -q '"has_diagnostics":false' /tmp/01_basic_math.c
          grep -q "BUNKER_TYPECHECK_JSON" /tmp/01_basic_math.c
          grep -q "bunker.self_host.typecheck.v1" /tmp/01_basic_math.c
          grep -q '"annotation_checks":true' /tmp/01_basic_math.c
          grep -q '"return_checks":true' /tmp/01_basic_math.c
          grep -q '"condition_checks":true' /tmp/01_basic_math.c
          grep -q '"call_argument_checks":true' /tmp/01_basic_math.c
          grep -q 'BUNKER_TYPECHECK_JSON: .*"has_diagnostics":false' /tmp/01_basic_math.c
          cp self-host/runtime.h /tmp/runtime.h
          cc -std=c11 /tmp/01_basic_math.c -o /tmp/01_basic_math
          set +e
          timeout --kill-after=5s 60s /tmp/01_basic_math
          status=$?
          set -e
          echo "01_basic_math exited $status, expected 42"
          test "$status" -eq 42

      - name: Check self-host resolver diagnostics
        timeout-minutes: 2
        run: |
          cat > /tmp/resolver_bad.bkr <<'BKR'
          kernel Broken {
              struct Pair { left: i32, left: i32 }

              fn main(x: i32, x: i32) -> i32 {
                  let y: i32 = 1;
                  let y: Missing = missing_fn(nope);
                  let p: Pair = Pair { left: y, right: 2 };
                  return nope;
              }
          }
          BKR
          timeout --kill-after=5s 60s ./bunker-cli/target/release/bunker-cli self-host-compile \
            /tmp/resolver_bad.bkr \
            -o /tmp/resolver_bad.c
          test -s /tmp/resolver_bad.c
          ! grep -q "Parse error" /tmp/resolver_bad.c
          grep -q "BUNKER_CAPABILITY_JSON" /tmp/resolver_bad.c
          grep -q '"name_resolver_report":true' /tmp/resolver_bad.c
          grep -q "BUNKER_RESOLVER_JSON" /tmp/resolver_bad.c
          grep -q "bunker.self_host.resolver.v1" /tmp/resolver_bad.c
          grep -q '"has_diagnostics":true' /tmp/resolver_bad.c
          grep -q '"diagnostic_count":' /tmp/resolver_bad.c
          grep -q "BKR_SELF_DUPLICATE_SYMBOL" /tmp/resolver_bad.c
          grep -q "BKR_SELF_UNRESOLVED_SYMBOL" /tmp/resolver_bad.c
          grep -q '"name":"missing_fn"' /tmp/resolver_bad.c
          grep -q '"name":"nope"' /tmp/resolver_bad.c
          grep -q '"name":"Missing"' /tmp/resolver_bad.c
          grep -q '"name":"right"' /tmp/resolver_bad.c

      - name: Check self-host typecheck diagnostics
        timeout-minutes: 2
        run: |
          cat > /tmp/typecheck_bad.bkr <<'BKR'
          kernel TypeBroken {
              fn add(x: i32, y: i32) -> i32 {
                  return x + y;
              }

              fn flag() -> bool {
                  return 1;
              }

              fn main() -> i32 {
                  let text: str = 42;
                  let ok: i32 = add(true, 2);
                  if 1 {
                      return text;
                  }
                  return false;
              }
          }
          BKR
          timeout --kill-after=5s 60s ./bunker-cli/target/release/bunker-cli self-host-compile \
            /tmp/typecheck_bad.bkr \
            -o /tmp/typecheck_bad.c
          test -s /tmp/typecheck_bad.c
          ! grep -q "Parse error" /tmp/typecheck_bad.c
          grep -q "BUNKER_CAPABILITY_JSON" /tmp/typecheck_bad.c
          grep -q '"typecheck_report":true' /tmp/typecheck_bad.c
          grep -q "BUNKER_TYPECHECK_JSON" /tmp/typecheck_bad.c
          grep -q "bunker.self_host.typecheck.v1" /tmp/typecheck_bad.c
          grep -q 'BUNKER_TYPECHECK_JSON: .*"has_diagnostics":true' /tmp/typecheck_bad.c
          grep -q '"diagnostic_count":' /tmp/typecheck_bad.c
          grep -q "BKR_SELF_TYPE_MISMATCH" /tmp/typecheck_bad.c
          grep -q "annotation_type_mismatch" /tmp/typecheck_bad.c
          grep -q "return_type_mismatch" /tmp/typecheck_bad.c
          grep -q "condition_type_mismatch" /tmp/typecheck_bad.c
          grep -q "call_argument_type_mismatch" /tmp/typecheck_bad.c
          grep -q '"name":"text"' /tmp/typecheck_bad.c
          grep -q '"name":"add"' /tmp/typecheck_bad.c
          grep -q '"expected":"str"' /tmp/typecheck_bad.c
          grep -q '"expected":"bool"' /tmp/typecheck_bad.c
          grep -q '"found":"i64"' /tmp/typecheck_bad.c
          grep -q '"found":"bool"' /tmp/typecheck_bad.c

      - name: Compile branching fixture through self-host compiler
        timeout-minutes: 2
        run: |
          timeout --kill-after=5s 60s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/14_kernel_if_branching.bkr \
            -o /tmp/14_kernel_if_branching.c
          test -s /tmp/14_kernel_if_branching.c
          cp self-host/runtime.h /tmp/runtime.h
          cc -std=c11 /tmp/14_kernel_if_branching.c -o /tmp/14_kernel_if_branching
          set +e
          timeout --kill-after=5s 60s /tmp/14_kernel_if_branching
          status=$?
          set -e
          echo "14_kernel_if_branching exited $status, expected 42"
          test "$status" -eq 42

      - name: Compile incremental parser fixture through self-host compiler
        timeout-minutes: 3
        run: |
          timeout --kill-after=5s 120s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/99_incremental_1.bkr \
            -o /tmp/99_incremental_1.c
          test -s /tmp/99_incremental_1.c
          ! grep -q "Parse error" /tmp/99_incremental_1.c
          cp self-host/runtime.h /tmp/runtime.h
          cc -std=c11 /tmp/99_incremental_1.c -o /tmp/99_incremental_1
          set +e
          timeout --kill-after=5s 60s /tmp/99_incremental_1
          status=$?
          set -e
          echo "99_incremental_1 exited $status, expected 42"
          test "$status" -eq 42

      - name: Compile incremental codegen fixture through self-host compiler
        timeout-minutes: 3
        run: |
          timeout --kill-after=5s 120s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/99_incremental_2.bkr \
            -o /tmp/99_incremental_2.c
          test -s /tmp/99_incremental_2.c
          ! grep -q "Parse error" /tmp/99_incremental_2.c
          cp self-host/runtime.h /tmp/runtime.h
          cc -std=c11 /tmp/99_incremental_2.c -o /tmp/99_incremental_2
          set +e
          timeout --kill-after=5s 60s /tmp/99_incremental_2
          status=$?
          set -e
          echo "99_incremental_2 exited $status, expected 42"
          test "$status" -eq 42

      - name: Compile while-loop fixture through self-host compiler
        timeout-minutes: 2
        run: |
          timeout --kill-after=5s 60s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/38_kernel_while_loop.bkr \
            -o /tmp/38_kernel_while_loop.c
          test -s /tmp/38_kernel_while_loop.c
          cp self-host/runtime.h /tmp/runtime.h
          cc -std=c11 /tmp/38_kernel_while_loop.c -o /tmp/38_kernel_while_loop
          set +e
          timeout --kill-after=5s 60s /tmp/38_kernel_while_loop
          status=$?
          set -e
          echo "38_kernel_while_loop exited $status, expected 55"
          test "$status" -eq 55

      - name: Compile while-break fixture through self-host compiler
        timeout-minutes: 2
        run: |
          timeout --kill-after=5s 60s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/39_kernel_while_break.bkr \
            -o /tmp/39_kernel_while_break.c
          test -s /tmp/39_kernel_while_break.c
          cp self-host/runtime.h /tmp/runtime.h
          cc -std=c11 /tmp/39_kernel_while_break.c -o /tmp/39_kernel_while_break
          set +e
          timeout --kill-after=5s 60s /tmp/39_kernel_while_break
          status=$?
          set -e
          echo "39_kernel_while_break exited $status, expected 15"
          test "$status" -eq 15

      - name: Compile with imported self-host compiler modules
        timeout-minutes: 2
        run: |
          timeout --kill-after=5s 60s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/01_basic_math.bkr \
            --compiler fixtures/self-host-import/driver.bkr \
            -o /tmp/imported_compiler.c
          test -s /tmp/imported_compiler.c
          cc -std=c11 /tmp/imported_compiler.c -o /tmp/imported_compiler
          set +e
          timeout --kill-after=5s 60s /tmp/imported_compiler
          status=$?
          set -e
          echo "imported_compiler exited $status, expected 42"
          test "$status" -eq 42

      - name: Compile and run bkrc through self-host compiler
        timeout-minutes: 10
        run: |
          timeout --kill-after=5s 240s ./bunker-cli/target/release/bunker-cli self-host-compile \
            self-host/bkrc.bkr \
            -o /tmp/bkrc.c
          test -s /tmp/bkrc.c
          ! grep -q "Parse error" /tmp/bkrc.c
          cp self-host/runtime.h /tmp/runtime.h
          cc -std=c11 /tmp/bkrc.c -o /tmp/bkrc

          run_invalid_bkrc_fixture() {
            compiler="$1"
            name="$2"
            run_dir="/tmp/$name"
            mkdir -p "$run_dir"
            printf '%s\n' 'kernel Broken { fn main( -> i32 { return 42; } }' > "$run_dir/self_host_input.bkr"
            set +e
            (cd "$run_dir" && timeout --kill-after=5s 60s "$compiler")
            bkrc_status=$?
            set -e
            echo "$name invalid input exited $bkrc_status, expected 42 with parse diagnostics"
            test "$bkrc_status" -eq 42
            test -s "$run_dir/self_host_output.c"
            grep -q "BUNKER_CAPABILITY_JSON" "$run_dir/self_host_output.c"
            grep -q "bunker.self_host.capability.v1" "$run_dir/self_host_output.c"
            grep -q '"structured_parse_diagnostics":true' "$run_dir/self_host_output.c"
            grep -q "Parse error at token" "$run_dir/self_host_output.c"
            grep -q "expected" "$run_dir/self_host_output.c"
            grep -q "got" "$run_dir/self_host_output.c"
            grep -q "AI repair hint" "$run_dir/self_host_output.c"
            grep -q "BUNKER_DIAGNOSTIC_JSON" "$run_dir/self_host_output.c"
            grep -q "schema_version" "$run_dir/self_host_output.c"
            grep -q "source_start" "$run_dir/self_host_output.c"
            grep -q "source_line" "$run_dir/self_host_output.c"
            grep -q "repair_hint" "$run_dir/self_host_output.c"
          }

          run_invalid_bkrc_fixture /tmp/bkrc bkrc-invalid

          run_generated_bkrc_fixture() {
            fixture="$1"
            name="$2"
            expected_status="$3"
            run_dir="/tmp/bkrc-run-$name"
            mkdir -p "$run_dir"
            cp "$fixture" "$run_dir/self_host_input.bkr"
            set +e
            (cd "$run_dir" && timeout --kill-after=5s 60s /tmp/bkrc)
            bkrc_status=$?
            set -e
            test "$bkrc_status" -eq 42
            test -s "$run_dir/self_host_output.c"
            ! grep -q "Parse error" "$run_dir/self_host_output.c"
            grep -q "BUNKER_AST_JSON" "$run_dir/self_host_output.c"
            grep -q "bunker.self_host.ast.v1" "$run_dir/self_host_output.c"
            grep -q '"source_byte_spans":true' "$run_dir/self_host_output.c"
            grep -q '"complete_tree":true' "$run_dir/self_host_output.c"
            grep -q '"tree":{"kind":"kernel"' "$run_dir/self_host_output.c"
            grep -q "BUNKER_TYPE_GRAPH_JSON" "$run_dir/self_host_output.c"
            grep -q "bunker.self_host.type_graph.v1" "$run_dir/self_host_output.c"
            grep -q '"declared_types":true' "$run_dir/self_host_output.c"
            grep -q "BUNKER_SYMBOL_TABLE_JSON" "$run_dir/self_host_output.c"
            grep -q "bunker.self_host.symbol_table.v1" "$run_dir/self_host_output.c"
            grep -q '"declaration_table":' "$run_dir/self_host_output.c"
            grep -q "BUNKER_RESOLVER_JSON" "$run_dir/self_host_output.c"
            grep -q "bunker.self_host.resolver.v1" "$run_dir/self_host_output.c"
            grep -q '"diagnostic_count":' "$run_dir/self_host_output.c"
            grep -q "BUNKER_TYPECHECK_JSON" "$run_dir/self_host_output.c"
            grep -q "bunker.self_host.typecheck.v1" "$run_dir/self_host_output.c"
