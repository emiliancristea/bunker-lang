  self-host-smoke:
    name: Self-host smoke inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Build release compiler
        working-directory: bunker-cli
        run: cargo build --release

      - name: Check self-host compiler sources
        timeout-minutes: 2
        run: ./bunker-cli/target/release/bunker-cli self-host-check self-host

      - name: Compile NodeKind-typed API fixture through self-host compiler
        timeout-minutes: 2
        run: |
          timeout --kill-after=5s 60s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/94_node_kind_typed_api.bkr \
            -o /tmp/94_node_kind_typed_api.c
          test -s /tmp/94_node_kind_typed_api.c
          ! grep -q "Parse error at token" /tmp/94_node_kind_typed_api.c
          grep -q "int main(void)" /tmp/94_node_kind_typed_api.c
          grep -q "echo_kind" /tmp/94_node_kind_typed_api.c
          grep -q "bkr_i64" /tmp/94_node_kind_typed_api.c

      - name: Compile TokenKind-typed API fixture through self-host compiler
        timeout-minutes: 2
        run: |
          timeout --kill-after=5s 60s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/95_token_kind_typed_api.bkr \
            -o /tmp/95_token_kind_typed_api.c
