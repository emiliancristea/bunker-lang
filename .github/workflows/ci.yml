  bootstrap-c11:
    name: Bootstrap C11 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build pure Bunker compiler from bootstrap C seed (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash bootstrap/build.sh
          test -x ./bkrc
          ./bkrc --help || ./bkrc --version || true
          echo "Bootstrap C11 build passed on POSIX!"

      - name: Build pure Bunker compiler from bootstrap C seed (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          cmd.exe /c "`"$vcvars`" && bootstrap\build.bat"
          if (!(Test-Path ".\bkrc.exe")) { exit 1 }
          cmd.exe /c ".\bkrc.exe || exit /b 0"
          Write-Output "Bootstrap C11 build passed on Windows!"
