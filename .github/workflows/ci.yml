name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  bunker-tests:
    name: Bunker test suite (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build bkrc from bootstrap C seed
        run: |
          bash bootstrap/build.sh
          test -x ./bkrc

      - name: Seed fixpoint (bkrc rebuilds itself into the checked-in seed)
        run: |
          ./bkrc compile self-host/bkrc.bkr -o /tmp/bkrc-self.c
          cmp /tmp/bkrc-self.c bootstrap/bkrc-stage1.c
          cmp bootstrap/bkrc-stage1.c bootstrap/bkrc-stage2.c
          cc -std=c11 -O2 -w -I bootstrap /tmp/bkrc-self.c -o /tmp/bkrc-stage2
          /tmp/bkrc-stage2 compile self-host/bkrc.bkr -o /tmp/bkrc-stage3.c
          cmp /tmp/bkrc-self.c /tmp/bkrc-stage3.c

      - name: Check self-host compiler sources
        run: ./bkrc self-host-check self-host

      - name: Run test suite (tools/test_runner.bkr)
        run: ./bkrc run tools/test_runner.bkr

  self-host-boundaries:
    name: Self-host boundary guards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Prevent raw AST collection traversal outside AST boundary
        shell: bash
        run: |
          set -euo pipefail
          pattern='ast_kernel_item_count\(|ast_kernel_item\(|ast_fn_param_count\(|ast_fn_param\(|ast_struct_field_count\(|ast_struct_field\(|ast_call_arg_count\(|ast_call_arg_handle\(|ast_array_element_count\(|ast_array_element_handle\(|ast_match_arm_count\(|ast_match_body_handle\(|ast_struct_lit_field_count\(|ast_struct_lit_field_name_idx\(|ast_struct_lit_field_value_handle\(|ast_pattern_list_get_ref\(ast_match_patterns|ast_node_list_get_ref\(ast_fn_params\(|ast_node_list_get_ref\(ast_struct_fields\('
          matches="$(mktemp)"
          grep -R -n -E "$pattern" self-host --include='*.bkr' | grep -v '^self-host/modules/ast\.bkr:' > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Raw AST collection traversal must stay inside self-host/modules/ast.bkr."
            cat "$matches"
            exit 1
          fi

      - name: Require NodeKind enum-backed AST tags
        shell: bash
        run: |
          set -euo pipefail
          constants='self-host/modules/constants.bkr'
          grep -q 'enum NodeKind {' "$constants"
          grep -q 'const NODE_FN: i64 = NodeKind.Fn;' "$constants"
          grep -q 'const NODE_ENUM: i64 = NodeKind.Enum;' "$constants"
          ! grep -q 'const NODE_FN: i64 = 2;' "$constants"

      - name: Require TokenKind enum-backed lexer tags
        shell: bash
        run: |
          set -euo pipefail
          constants='self-host/modules/constants.bkr'
          grep -q 'enum TokenKind {' "$constants"
          grep -q 'const TOK_EOF: i64 = TokenKind.Eof;' "$constants"
          grep -q 'const TOK_FN: i64 = TokenKind.Fn;' "$constants"
          grep -q 'const TOK_FAT_ARROW: i64 = TokenKind.FatArrow;' "$constants"
          ! grep -q 'const TOK_FN: i64 = 23;' "$constants"

      - name: Require PatternKind and TypeKind enum-backed tags
        shell: bash
        run: |
          set -euo pipefail
          constants='self-host/modules/constants.bkr'
          grep -q 'enum PatternKind {' "$constants"
          grep -q 'const PAT_INT: i64 = PatternKind.Int;' "$constants"
          grep -q 'const PAT_ENUM_VARIANT: i64 = PatternKind.EnumVariant;' "$constants"
          grep -q 'enum TypeKind {' "$constants"
          grep -q 'const TYPE_I32: i64 = TypeKind.I32;' "$constants"
          grep -q 'const TYPE_STRUCT: i64 = TypeKind.Struct;' "$constants"
          grep -q 'const TYPE_UNKNOWN: i64 = 99;' "$constants"
          ! grep -q 'const PAT_INT: i64 = 1;' "$constants"
          ! grep -q 'const TYPE_I32: i64 = 0;' "$constants"

      - name: Require NodeKind-typed AST kind APIs
        shell: bash
        run: |
          set -euo pipefail
          kind_model='self-host/modules/kind_model.bkr'
          ast='self-host/modules/ast.bkr'
          grep -q 'fn ast_node_kind_name(kind: NodeKind) -> str' "$kind_model"
          grep -q 'fn ast_node_category_kind(kind: NodeKind) -> i64' "$kind_model"
          grep -q 'fn ast_is_item_kind(kind: NodeKind) -> bool' "$kind_model"
          grep -q 'fn ast_node_ref_new(kind: NodeKind) -> AstNodeRef' "$ast"
          grep -q 'fn ast_node_kind(node: Vec<i64>) -> NodeKind' "$ast"
          grep -q 'fn ast_node_ref_kind(node_ref: AstNodeRef) -> NodeKind' "$ast"
          grep -q 'fn ast_expr_ref_kind(expr_ref: AstExprRef) -> NodeKind' "$ast"
          grep -q 'fn ast_stmt_ref_kind(stmt_ref: AstStmtRef) -> NodeKind' "$ast"
          grep -q 'fn ast_item_ref_kind(item_ref: AstItemRef) -> NodeKind' "$ast"
          ! grep -q 'fn ast_node_kind_name(kind: i64)' "$kind_model"
          ! grep -q 'fn ast_node_ref_kind(node_ref: AstNodeRef) -> i64' "$ast"

      - name: Require TokenKind-typed lexer APIs
        shell: bash
        run: |
          set -euo pipefail
          kind_model='self-host/modules/kind_model.bkr'
          parser='self-host/modules/parser.bkr'
          parser_state='self-host/modules/parser_state.bkr'
          lexer='self-host/modules/lexer.bkr'
          grep -q 'fn token_kind_name(kind: TokenKind) -> str' "$kind_model"
          grep -q 'fn token_is_name_kind(kind: TokenKind) -> bool' "$kind_model"
          grep -q 'fn token_name(tok: TokenKind) -> str' "$parser"
          grep -q 'fn is_name_token(tok: TokenKind) -> bool' "$parser"
          grep -q 'fn parser_peek_ref(p_ref: ParserStateRef) -> TokenKind' "$parser_state"
          grep -q 'fn parser_expect_ref(p_ref: ParserStateRef, expected: TokenKind) -> bool' "$parser_state"
          grep -q 'fn parser_error_expected_ref(p_ref: ParserStateRef) -> TokenKind' "$parser_state"
          grep -q 'fn parse_insert_text_for_expected_token(expected_token: TokenKind) -> str' 'self-host/modules/driver.bkr'
          grep -q 'let tok_type: TokenKind =' "$lexer"
          ! grep -q 'fn token_kind_name(kind: i64)' "$kind_model"
          ! grep -q 'fn token_name(tok: i64)' "$parser"
          ! grep -q 'fn parser_peek_ref(p_ref: ParserStateRef) -> i64' "$parser_state"
          ! grep -q 'fn parse_insert_text_for_expected_token(expected_token: i64)' 'self-host/modules/driver.bkr'

      - name: Require PatternKind and TypeKind typed APIs
        shell: bash
        run: |
          set -euo pipefail
          kind_model='self-host/modules/kind_model.bkr'
          ast='self-host/modules/ast.bkr'
          typecheck='self-host/modules/typecheck.bkr'
          c_codegen='self-host/modules/c_codegen.bkr'
          grep -q 'fn ast_type_kind_name(kind: TypeKind) -> str' "$kind_model"
          grep -q 'fn ast_pattern_kind_name(kind: PatternKind) -> str' "$kind_model"
          grep -q 'fn ast_pattern_ref_new(kind: PatternKind, value: i64) -> AstPatternRef' "$ast"
          grep -q 'fn ast_pattern_ref_kind(pattern_ref: AstPatternRef) -> PatternKind' "$ast"
          grep -q 'fn ast_pattern_kind(pattern: Vec<i64>) -> PatternKind' "$ast"
          grep -q 'fn ast_type_ref(kind: TypeKind) -> AstTypeRef' "$ast"
          grep -q 'fn ast_type_ref_kind_value(type_ref: AstTypeRef) -> TypeKind' "$ast"
          grep -q 'fn ast_type_kind_value(type_node: i64) -> TypeKind' "$ast"
          grep -q 'fn typecheck_is_integer_kind(kind: TypeKind) -> bool' "$typecheck"
          grep -q 'fn type_to_c(kind: TypeKind) -> str' "$c_codegen"
          grep -q 'const TYPE_UNKNOWN: i64 = 99;' 'self-host/modules/constants.bkr'
          ! grep -q 'fn ast_type_kind_name(kind: i64)' "$kind_model"
          ! grep -q 'fn ast_pattern_kind_name(kind: i64)' "$kind_model"
          ! grep -q 'fn ast_pattern_ref_kind(pattern_ref: AstPatternRef) -> i64' "$ast"
          ! grep -q 'fn ast_type_ref_kind_value(type_ref: AstTypeRef) -> i64' "$ast"
          ! grep -q 'fn typecheck_is_integer_kind(kind: i64)' "$typecheck"
          ! grep -q 'fn type_to_c(kind: i64)' "$c_codegen"

      - name: Require AstSpan struct span APIs
        shell: bash
        run: |
          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          parser='self-host/modules/parser.bkr'
          driver='self-host/modules/driver.bkr'
          grep -q 'struct AstSpan {' "$ast"
          grep -q 'fn ast_span(start: i64, end: i64) -> AstSpan' "$ast"
          grep -q 'fn ast_span_unknown() -> AstSpan' "$ast"
          grep -q 'fn ast_span_start(span: AstSpan) -> i64' "$ast"
          grep -q 'fn ast_span_end(span: AstSpan) -> i64' "$ast"
          grep -q 'fn ast_span_is_known(span: AstSpan) -> bool' "$ast"
          grep -q 'fn ast_node_span(node: Vec<i64>) -> AstSpan' "$ast"
          grep -q 'fn parser_error_span_ref(p: ParserStateRef) -> AstSpan' "$parser"
          grep -q 'let error_span: AstSpan = parser_error_span_ref(p);' "$driver"
          grep -q 'let source_start = error_span.start;' "$driver"
          ! grep -q 'fn ast_span(start: i64, end: i64) -> Vec<i64>' "$ast"
          ! grep -q 'fn ast_span_start(span: Vec<i64>)' "$ast"
          ! grep -q 'fn parser_error_span_ref(p: ParserStateRef) -> Vec<i64>' "$parser"

      - name: Require AstPattern struct pattern records
        shell: bash
        run: |
          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          grep -q 'struct AstPattern {' "$ast"
          grep -q 'fn ast_pattern_record(kind: PatternKind, value: i64) -> AstPattern' "$ast"
          grep -q 'fn ast_pattern_pack(pattern: AstPattern) -> Vec<i64>' "$ast"
          grep -q 'fn ast_pattern_unpack(node: Vec<i64>) -> AstPattern' "$ast"
          grep -q 'fn ast_pattern_ref_record(pattern_ref: AstPatternRef) -> AstPattern' "$ast"
          grep -q 'let pattern: AstPattern = ast_pattern_record2(kind, value, aux);' "$ast"
          grep -q 'let pattern: AstPattern = ast_pattern_ref_record(pattern_ref);' "$ast"
          ! grep -q 'vec_push(pattern, kind);' "$ast"

      - name: Require AstType struct type records
        shell: bash
        run: |
          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          grep -q 'struct AstType {' "$ast"
          grep -q 'fn ast_type_record(kind: TypeKind) -> AstType' "$ast"
          grep -q 'fn ast_type_pack(type_rec: AstType) -> Vec<i64>' "$ast"
          grep -q 'fn ast_type_unpack(node: Vec<i64>) -> AstType' "$ast"
          grep -q 'fn ast_type_ref_record(type_ref: AstTypeRef) -> AstType' "$ast"
          grep -q 'let rec: AstType = ast_type_record(kind);' "$ast"
          grep -q 'let rec: AstType = ast_type_ref_record(type_ref);' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_TYPE)' "$ast"

      - name: Require AstAtom struct atomic expression records
        shell: bash
        run: |
          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          grep -q 'struct AstAtom {' "$ast"
          grep -q 'fn ast_atom_record(kind: NodeKind, payload: i64) -> AstAtom' "$ast"
          grep -q 'fn ast_atom_pack(atom: AstAtom) -> Vec<i64>' "$ast"
          grep -q 'fn ast_atom_unpack(node: Vec<i64>) -> AstAtom' "$ast"
          grep -q 'fn ast_expr_ref_atom(expr_ref: AstExprRef) -> AstAtom' "$ast"
          grep -q 'let rec: AstAtom = ast_atom_record(kind, payload);' "$ast"
          grep -q 'return ast_atom_expr_ref(NodeKind.IntLit, value);' "$ast"
          grep -q 'return ast_atom_expr_ref(NodeKind.Ident, name_idx);' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_INT_LIT)' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_IDENT)' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_BOOL_LIT)' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_STR_LIT)' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_FLOAT_LIT)' "$ast"

      - name: Require AstBinary and AstUnary struct operator records
        shell: bash
        run: |
          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          grep -q 'struct AstBinary {' "$ast"
          grep -q 'struct AstUnary {' "$ast"
          grep -q 'fn ast_binary_record(op: TokenKind, left: i64, right: i64) -> AstBinary' "$ast"
          grep -q 'fn ast_binary_pack(binary: AstBinary) -> Vec<i64>' "$ast"
          grep -q 'fn ast_binary_unpack(node: Vec<i64>) -> AstBinary' "$ast"
          grep -q 'fn ast_expr_ref_binary(expr_ref: AstExprRef) -> AstBinary' "$ast"
          grep -q 'fn ast_binary_ref(op: TokenKind, left_ref: AstExprRef, right_ref: AstExprRef) -> AstExprRef' "$ast"
          grep -q 'fn ast_unary_ref(op: TokenKind, operand_ref: AstExprRef) -> AstExprRef' "$ast"
          grep -q 'fn ast_binary_ref_op(expr_ref: AstExprRef) -> TokenKind' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_BINARY)' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_UNARY)' "$ast"
          ! grep -q 'fn ast_binary_ref(op: i64' "$ast"
          ! grep -q 'fn ast_binary_ref_op(expr_ref: AstExprRef) -> i64' "$ast"

      - name: Require AstCall struct call records
        shell: bash
        run: |
          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          grep -q 'struct AstCall {' "$ast"
          grep -q 'fn ast_call_record(name_idx: i64, args: i64) -> AstCall' "$ast"
          grep -q 'fn ast_call_pack(call: AstCall) -> Vec<i64>' "$ast"
          grep -q 'fn ast_call_unpack(node: Vec<i64>) -> AstCall' "$ast"
          grep -q 'fn ast_expr_ref_call(expr_ref: AstExprRef) -> AstCall' "$ast"
          grep -q 'let rec: AstCall = ast_call_record(name_idx, ast_node_list_ref_handle(args_ref));' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_CALL)' "$ast"

      - name: Require AstIndex and AstFieldAccess struct records
        shell: bash
        run: |
          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          grep -q 'struct AstIndex {' "$ast"
          grep -q 'struct AstFieldAccess {' "$ast"
          grep -q 'fn ast_index_record(base: i64, index: i64) -> AstIndex' "$ast"
          grep -q 'fn ast_index_pack(idx: AstIndex) -> Vec<i64>' "$ast"
          grep -q 'fn ast_index_unpack(node: Vec<i64>) -> AstIndex' "$ast"
          grep -q 'fn ast_expr_ref_index(expr_ref: AstExprRef) -> AstIndex' "$ast"
          grep -q 'fn ast_field_access_record(base: i64, name_idx: i64) -> AstFieldAccess' "$ast"
          grep -q 'fn ast_expr_ref_field_access(expr_ref: AstExprRef) -> AstFieldAccess' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_INDEX)' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_FIELD_ACCESS)' "$ast"

      - name: Require AstLet and AstReturn struct statement records
        shell: bash
        run: |
          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          grep -q 'struct AstLet {' "$ast"
          grep -q 'struct AstReturn {' "$ast"
          grep -q 'fn ast_let_record(name_idx: i64, type_handle: i64, init: i64) -> AstLet' "$ast"
          grep -q 'fn ast_let_pack(stmt: AstLet) -> Vec<i64>' "$ast"
          grep -q 'fn ast_let_unpack(node: Vec<i64>) -> AstLet' "$ast"
          grep -q 'fn ast_stmt_ref_let(stmt_ref: AstStmtRef) -> AstLet' "$ast"
          grep -q 'fn ast_return_record(expr: i64) -> AstReturn' "$ast"
          grep -q 'fn ast_stmt_ref_return(stmt_ref: AstStmtRef) -> AstReturn' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_LET)' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_RETURN)' "$ast"

      - name: Require AstIf and AstWhile struct statement records
        shell: bash
        run: |
          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          grep -q 'struct AstIf {' "$ast"
          grep -q 'struct AstWhile {' "$ast"
          grep -q 'fn ast_if_record(cond: i64, then_block: i64, else_block: i64) -> AstIf' "$ast"
          grep -q 'fn ast_if_pack(stmt: AstIf) -> Vec<i64>' "$ast"
          grep -q 'fn ast_if_unpack(node: Vec<i64>) -> AstIf' "$ast"
          grep -q 'fn ast_stmt_ref_if(stmt_ref: AstStmtRef) -> AstIf' "$ast"
          grep -q 'fn ast_while_record(cond: i64, body: i64) -> AstWhile' "$ast"
          grep -q 'fn ast_stmt_ref_while(stmt_ref: AstStmtRef) -> AstWhile' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_IF)' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_WHILE)' "$ast"

      - name: Require AstFor and AstLoop struct statement records
        shell: bash
        run: |
          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          grep -q 'struct AstFor {' "$ast"
          grep -q 'struct AstLoop {' "$ast"
          grep -q 'fn ast_for_record(name_idx: i64, start_expr: i64, end_expr: i64, inclusive: i64, body: i64) -> AstFor' "$ast"
          grep -q 'fn ast_for_pack(stmt: AstFor) -> Vec<i64>' "$ast"
          grep -q 'fn ast_for_unpack(node: Vec<i64>) -> AstFor' "$ast"
          grep -q 'fn ast_stmt_ref_for(stmt_ref: AstStmtRef) -> AstFor' "$ast"
          grep -q 'fn ast_loop_record(body: i64) -> AstLoop' "$ast"
          grep -q 'fn ast_stmt_ref_loop(stmt_ref: AstStmtRef) -> AstLoop' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_FOR)' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_LOOP)' "$ast"

      - name: Require AstAssign and AstExprStmt struct statement records
        shell: bash
        run: |
          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          grep -q 'struct AstAssign {' "$ast"
          grep -q 'struct AstExprStmt {' "$ast"
          grep -q 'fn ast_assign_record(target: i64, value: i64) -> AstAssign' "$ast"
          grep -q 'fn ast_assign_pack(stmt: AstAssign) -> Vec<i64>' "$ast"
          grep -q 'fn ast_assign_unpack(node: Vec<i64>) -> AstAssign' "$ast"
          grep -q 'fn ast_stmt_ref_assign(stmt_ref: AstStmtRef) -> AstAssign' "$ast"
          grep -q 'fn ast_expr_stmt_record(expr: i64) -> AstExprStmt' "$ast"
          grep -q 'fn ast_stmt_ref_expr_stmt(stmt_ref: AstStmtRef) -> AstExprStmt' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_ASSIGN)' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_EXPR_STMT)' "$ast"

      - name: Require AstTernary struct expression records
        shell: bash
        run: |
          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          grep -q 'struct AstTernary {' "$ast"
          grep -q 'fn ast_ternary_record(cond: i64, then_expr: i64, else_expr: i64) -> AstTernary' "$ast"
          grep -q 'fn ast_ternary_pack(expr: AstTernary) -> Vec<i64>' "$ast"
          grep -q 'fn ast_ternary_unpack(node: Vec<i64>) -> AstTernary' "$ast"
          grep -q 'fn ast_expr_ref_ternary(expr_ref: AstExprRef) -> AstTernary' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_TERNARY)' "$ast"

      - name: Require AstArrayLit and AstStructLit struct records
        shell: bash
        run: |
          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          grep -q 'struct AstArrayLit {' "$ast"
          grep -q 'struct AstStructLit {' "$ast"
          grep -q 'fn ast_array_lit_record(elements: i64) -> AstArrayLit' "$ast"
          grep -q 'fn ast_array_lit_pack(expr: AstArrayLit) -> Vec<i64>' "$ast"
          grep -q 'fn ast_array_lit_unpack(node: Vec<i64>) -> AstArrayLit' "$ast"
          grep -q 'fn ast_expr_ref_array_lit(expr_ref: AstExprRef) -> AstArrayLit' "$ast"
          grep -q 'fn ast_struct_lit_record(name_idx: i64, field_names: i64, field_values: i64) -> AstStructLit' "$ast"
          grep -q 'fn ast_expr_ref_struct_lit(expr_ref: AstExprRef) -> AstStructLit' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_ARRAY_LIT)' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_STRUCT_LIT)' "$ast"

      - name: Require AstMatch struct expression records
        shell: bash
        run: |
          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          grep -q 'struct AstMatch {' "$ast"
          grep -q 'fn ast_match_record(scrutinee: i64, patterns: i64, bodies: i64, guards: i64) -> AstMatch' "$ast"
          grep -q 'fn ast_match_pack(expr: AstMatch) -> Vec<i64>' "$ast"
          grep -q 'fn ast_match_unpack(node: Vec<i64>) -> AstMatch' "$ast"
          grep -q 'fn ast_expr_ref_match(expr_ref: AstExprRef) -> AstMatch' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_MATCH)' "$ast"

      - name: Require AstParam and AstFn struct item records
        shell: bash
        run: |
          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          grep -q 'struct AstParam {' "$ast"
          grep -q 'struct AstFn {' "$ast"
          grep -q 'fn ast_param_record(name_idx: i64, type_handle: i64) -> AstParam' "$ast"
          grep -q 'fn ast_param_pack(param: AstParam) -> Vec<i64>' "$ast"
          grep -q 'fn ast_param_unpack(node: Vec<i64>) -> AstParam' "$ast"
          grep -q 'fn ast_node_ref_param(node_ref: AstNodeRef) -> AstParam' "$ast"
          grep -q 'fn ast_fn_record(name_idx: i64, params: i64, return_type: i64, body: i64) -> AstFn' "$ast"
          grep -q 'fn ast_item_ref_fn(item_ref: AstItemRef) -> AstFn' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_PARAM)' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_FN)' "$ast"

      - name: Require AstConst and AstFieldDecl struct item records
        shell: bash
        run: |
          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          grep -q 'struct AstConst {' "$ast"
          grep -q 'struct AstFieldDecl {' "$ast"
          grep -q 'fn ast_const_record(name_idx: i64, type_handle: i64, value: i64) -> AstConst' "$ast"
          grep -q 'fn ast_const_pack(item: AstConst) -> Vec<i64>' "$ast"
          grep -q 'fn ast_const_unpack(node: Vec<i64>) -> AstConst' "$ast"
          grep -q 'fn ast_item_ref_const(item_ref: AstItemRef) -> AstConst' "$ast"
          grep -q 'fn ast_field_decl_record(name_idx: i64, type_handle: i64) -> AstFieldDecl' "$ast"
          grep -q 'fn ast_node_ref_field_decl(node_ref: AstNodeRef) -> AstFieldDecl' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_CONST)' "$ast"
          ! grep -q 'ast_node_ref_new(NODE_FIELD)' "$ast"

      - name: Require AstStruct and AstEnum struct item records
        shell: bash
        run: |
          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          grep -q 'struct AstStruct {' "$ast"
