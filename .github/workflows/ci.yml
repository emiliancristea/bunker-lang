name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: rustup default ${{ matrix.rust }}

      - name: Build
        working-directory: bunker-cli
        run: cargo build --verbose

      - name: Run Rust tests
        working-directory: bunker-cli
        run: cargo test --verbose

      - name: Build release
        working-directory: bunker-cli
        run: cargo build --release --verbose

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: bunker-cli-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            bunker-cli/target/release/bunker-cli
            bunker-cli/target/release/bunker-cli.exe

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        working-directory: bunker-cli
        run: cargo fmt -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        working-directory: bunker-cli
        run: cargo clippy -- -D warnings

  bunker-tests:
    name: Bunker language tests
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Build release compiler
        working-directory: bunker-cli
        run: cargo build --release

      - name: Run Bunker test suite
        shell: pwsh
        run: ./run_tests.ps1 -Verbose

  self-host-smoke:
    name: Self-host smoke inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Build release compiler
        working-directory: bunker-cli
        run: cargo build --release

      - name: Check self-host compiler sources
        timeout-minutes: 2
        run: ./bunker-cli/target/release/bunker-cli self-host-check self-host

      - name: Compile basic fixture through self-host compiler
        timeout-minutes: 2
        run: |
          timeout --kill-after=5s 60s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/01_basic_math.bkr \
            -o /tmp/01_basic_math.c
          test -s /tmp/01_basic_math.c
          cp self-host/runtime.h /tmp/runtime.h
          cc -std=c11 /tmp/01_basic_math.c -o /tmp/01_basic_math
          set +e
          timeout --kill-after=5s 60s /tmp/01_basic_math
          status=$?
          set -e
          echo "01_basic_math exited $status, expected 42"
          test "$status" -eq 42

      - name: Compile branching fixture through self-host compiler
        timeout-minutes: 2
        run: |
          timeout --kill-after=5s 60s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/14_kernel_if_branching.bkr \
            -o /tmp/14_kernel_if_branching.c
          test -s /tmp/14_kernel_if_branching.c
          cp self-host/runtime.h /tmp/runtime.h
          cc -std=c11 /tmp/14_kernel_if_branching.c -o /tmp/14_kernel_if_branching
          set +e
          timeout --kill-after=5s 60s /tmp/14_kernel_if_branching
          status=$?
          set -e
          echo "14_kernel_if_branching exited $status, expected 42"
          test "$status" -eq 42

      - name: Compile incremental parser fixture through self-host compiler
        timeout-minutes: 3
        run: |
          timeout --kill-after=5s 120s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/99_incremental_1.bkr \
            -o /tmp/99_incremental_1.c
          test -s /tmp/99_incremental_1.c
          ! grep -q "Parse error" /tmp/99_incremental_1.c
          cp self-host/runtime.h /tmp/runtime.h
          cc -std=c11 /tmp/99_incremental_1.c -o /tmp/99_incremental_1
          set +e
          timeout --kill-after=5s 60s /tmp/99_incremental_1
          status=$?
          set -e
          echo "99_incremental_1 exited $status, expected 42"
          test "$status" -eq 42

      - name: Compile incremental codegen fixture through self-host compiler
        timeout-minutes: 3
        run: |
          timeout --kill-after=5s 120s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/99_incremental_2.bkr \
            -o /tmp/99_incremental_2.c
          test -s /tmp/99_incremental_2.c
          ! grep -q "Parse error" /tmp/99_incremental_2.c
          cp self-host/runtime.h /tmp/runtime.h
          cc -std=c11 /tmp/99_incremental_2.c -o /tmp/99_incremental_2
          set +e
          timeout --kill-after=5s 60s /tmp/99_incremental_2
          status=$?
          set -e
          echo "99_incremental_2 exited $status, expected 42"
          test "$status" -eq 42

      - name: Compile while-loop fixture through self-host compiler
        timeout-minutes: 2
        run: |
          timeout --kill-after=5s 60s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/38_kernel_while_loop.bkr \
            -o /tmp/38_kernel_while_loop.c
          test -s /tmp/38_kernel_while_loop.c
          cp self-host/runtime.h /tmp/runtime.h
          cc -std=c11 /tmp/38_kernel_while_loop.c -o /tmp/38_kernel_while_loop
          set +e
          timeout --kill-after=5s 60s /tmp/38_kernel_while_loop
          status=$?
          set -e
          echo "38_kernel_while_loop exited $status, expected 55"
          test "$status" -eq 55

      - name: Compile while-break fixture through self-host compiler
        timeout-minutes: 2
        run: |
          timeout --kill-after=5s 60s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/39_kernel_while_break.bkr \
            -o /tmp/39_kernel_while_break.c
          test -s /tmp/39_kernel_while_break.c
          cp self-host/runtime.h /tmp/runtime.h
          cc -std=c11 /tmp/39_kernel_while_break.c -o /tmp/39_kernel_while_break
          set +e
          timeout --kill-after=5s 60s /tmp/39_kernel_while_break
          status=$?
          set -e
          echo "39_kernel_while_break exited $status, expected 15"
          test "$status" -eq 15

      - name: Compile and run bkrc through self-host compiler
        timeout-minutes: 10
        run: |
          timeout --kill-after=5s 240s ./bunker-cli/target/release/bunker-cli self-host-compile \
            self-host/bkrc.bkr \
            -o /tmp/bkrc.c
          test -s /tmp/bkrc.c
          ! grep -q "Parse error" /tmp/bkrc.c
          cp self-host/runtime.h /tmp/runtime.h
          cc -std=c11 /tmp/bkrc.c -o /tmp/bkrc

          run_invalid_bkrc_fixture() {
            compiler="$1"
            name="$2"
            run_dir="/tmp/$name"
            mkdir -p "$run_dir"
            printf '%s\n' 'kernel Broken { fn main( -> i32 { return 42; } }' > "$run_dir/self_host_input.bkr"
            set +e
            (cd "$run_dir" && timeout --kill-after=5s 60s "$compiler")
            bkrc_status=$?
            set -e
            echo "$name invalid input exited $bkrc_status, expected 42 with parse diagnostics"
            test "$bkrc_status" -eq 42
            test -s "$run_dir/self_host_output.c"
            grep -q "Parse error at token" "$run_dir/self_host_output.c"
            grep -q "expected" "$run_dir/self_host_output.c"
            grep -q "got" "$run_dir/self_host_output.c"
            grep -q "AI repair hint" "$run_dir/self_host_output.c"
          }

          run_invalid_bkrc_fixture /tmp/bkrc bkrc-invalid

          run_generated_bkrc_fixture() {
            fixture="$1"
            name="$2"
            expected_status="$3"
            run_dir="/tmp/bkrc-run-$name"
            mkdir -p "$run_dir"
            cp "$fixture" "$run_dir/self_host_input.bkr"
            set +e
            (cd "$run_dir" && timeout --kill-after=5s 60s /tmp/bkrc)
            bkrc_status=$?
            set -e
            test "$bkrc_status" -eq 42
            test -s "$run_dir/self_host_output.c"
            ! grep -q "Parse error" "$run_dir/self_host_output.c"
            cp self-host/runtime.h "$run_dir/runtime.h"
            cc -std=c11 "$run_dir/self_host_output.c" -o "$run_dir/$name"
            set +e
            timeout --kill-after=5s 60s "$run_dir/$name"
            program_status=$?
            set -e
            echo "generated $name exited $program_status, expected $expected_status"
            test "$program_status" -eq "$expected_status"
          }

          run_generated_bkrc_fixture tests/01_basic_math.bkr basic 42
          run_generated_bkrc_fixture tests/14_kernel_if_branching.bkr branching 42
          run_generated_bkrc_fixture tests/16_kernel_match_block_expr.bkr match_block 12
          run_generated_bkrc_fixture tests/19_kernel_match_binding.bkr match_binding 7
          run_generated_bkrc_fixture tests/20_kernel_option_basic.bkr option_basic 15
          run_generated_bkrc_fixture tests/21_kernel_option_if_infer.bkr option_if_infer 7
          run_generated_bkrc_fixture tests/32_kernel_for_range.bkr for_range 55
          run_generated_bkrc_fixture tests/33_kernel_loop_break.bkr loop_break 5
          run_generated_bkrc_fixture tests/34_kernel_for_continue.bkr for_continue 25
          run_generated_bkrc_fixture tests/35_kernel_for_break.bkr for_break 15
          run_generated_bkrc_fixture tests/36_kernel_type_cast.bkr type_cast 46
          run_generated_bkrc_fixture tests/37_kernel_string_concat.bkr string_concat 11
          run_generated_bkrc_fixture tests/38_kernel_while_loop.bkr while_loop 55
          run_generated_bkrc_fixture tests/39_kernel_while_break.bkr while_break 15
          run_generated_bkrc_fixture tests/40_kernel_bitwise_ops.bkr bitwise_ops 42
          run_generated_bkrc_fixture tests/41_kernel_len_builtin.bkr len_builtin 15
          run_generated_bkrc_fixture tests/42_kernel_ternary.bkr ternary 42
          run_generated_bkrc_fixture tests/43_kernel_modulo.bkr modulo 42
          run_generated_bkrc_fixture tests/44_kernel_unary_neg.bkr unary_neg 42
          run_generated_bkrc_fixture tests/45_kernel_nested_calls.bkr nested_calls 42
          run_generated_bkrc_fixture tests/46_kernel_struct_ops.bkr struct_ops 42
          run_generated_bkrc_fixture tests/47_kernel_array_ops.bkr array_ops 42
          run_generated_bkrc_fixture tests/49_kernel_bool_logic.bkr bool_logic 42
          run_generated_bkrc_fixture tests/50_kernel_recursive_gcd.bkr recursive_gcd 42
          run_generated_bkrc_fixture tests/51_kernel_comparisons.bkr comparisons 42
          run_generated_bkrc_fixture tests/52_kernel_option_match.bkr option_match 42
          run_generated_bkrc_fixture tests/53_kernel_float_ops.bkr float_ops 42
          run_generated_bkrc_fixture tests/54_kernel_i64_ops.bkr i64_ops 42
          run_generated_bkrc_fixture tests/55_kernel_const.bkr consts 42
          run_generated_bkrc_fixture tests/48_kernel_control_flow.bkr control_flow 42
          run_generated_bkrc_fixture tests/56_kernel_early_return.bkr early_return 42
          run_generated_bkrc_fixture tests/57_kernel_multiple_structs.bkr multiple_structs 42
          run_generated_bkrc_fixture tests/63_arena_loop_reuse.bkr arena_loop_reuse 42
          run_generated_bkrc_fixture tests/64_arena_nested_blocks.bkr arena_nested_blocks 42
          run_generated_bkrc_fixture tests/65_arena_if_branches.bkr arena_if_branches 42
          run_generated_bkrc_fixture tests/72_file_io.bkr file_io 42
          run_generated_bkrc_fixture tests/73_string_methods.bkr string_methods 42
          run_generated_bkrc_fixture tests/74_vec_operations.bkr vec_operations 42
          run_generated_bkrc_fixture tests/75_result_type.bkr result_type 42
          run_generated_bkrc_fixture tests/76_hashmap_operations.bkr hashmap_operations 42
          run_generated_bkrc_fixture tests/77_typed_vec_operations.bkr typed_vec_operations 42
          run_generated_bkrc_fixture tests/79_typed_result_operations.bkr typed_result_ops 42
          run_generated_bkrc_fixture tests/81_typed_hashmap_operations.bkr typed_hashmap_operations 42
          run_generated_bkrc_fixture tests/85_result_handle_roundtrip.bkr result_handle_roundtrip 42
          run_generated_bkrc_fixture tests/99_incremental_1.bkr incremental_1 42
          run_generated_bkrc_fixture tests/99_incremental_2.bkr incremental_2 42

          self_compile_dir="/tmp/bkrc-self"
          mkdir -p "$self_compile_dir"
          cp self-host/bkrc.bkr "$self_compile_dir/self_host_input.bkr"
          set +e
          (cd "$self_compile_dir" && timeout --kill-after=5s 240s /tmp/bkrc)
          bkrc_self_status=$?
          set -e
          echo "generated bkrc self-compile exited $bkrc_self_status, expected 42"
          test "$bkrc_self_status" -eq 42
          test -s "$self_compile_dir/self_host_output.c"
          ! grep -q "Parse error" "$self_compile_dir/self_host_output.c"
          cp self-host/runtime.h "$self_compile_dir/runtime.h"
          cc -std=c11 "$self_compile_dir/self_host_output.c" -o "$self_compile_dir/bkrc2"

          run_invalid_bkrc_fixture "$self_compile_dir/bkrc2" bkrc2-invalid

          run_stage2_bkrc_fixture() {
            fixture="$1"
            name="$2"
            expected_status="$3"
            run_dir="/tmp/bkrc2-run-$name"
            mkdir -p "$run_dir"
            cp "$fixture" "$run_dir/self_host_input.bkr"
            set +e
            (cd "$run_dir" && timeout --kill-after=5s 60s "$self_compile_dir/bkrc2")
            bkrc_status=$?
            set -e
            test "$bkrc_status" -eq 42
            test -s "$run_dir/self_host_output.c"
            ! grep -q "Parse error" "$run_dir/self_host_output.c"
            cp self-host/runtime.h "$run_dir/runtime.h"
            cc -std=c11 "$run_dir/self_host_output.c" -o "$run_dir/$name"
            set +e
            timeout --kill-after=5s 60s "$run_dir/$name"
            program_status=$?
            set -e
            echo "stage2 generated $name exited $program_status, expected $expected_status"
            test "$program_status" -eq "$expected_status"
          }

          run_stage2_bkrc_fixture tests/01_basic_math.bkr basic 42
          run_stage2_bkrc_fixture tests/14_kernel_if_branching.bkr branching 42
          run_stage2_bkrc_fixture tests/16_kernel_match_block_expr.bkr match_block 12
          run_stage2_bkrc_fixture tests/19_kernel_match_binding.bkr match_binding 7
          run_stage2_bkrc_fixture tests/20_kernel_option_basic.bkr option_basic 15
          run_stage2_bkrc_fixture tests/21_kernel_option_if_infer.bkr option_if_infer 7
          run_stage2_bkrc_fixture tests/32_kernel_for_range.bkr for_range 55
          run_stage2_bkrc_fixture tests/33_kernel_loop_break.bkr loop_break 5
          run_stage2_bkrc_fixture tests/34_kernel_for_continue.bkr for_continue 25
          run_stage2_bkrc_fixture tests/35_kernel_for_break.bkr for_break 15
          run_stage2_bkrc_fixture tests/36_kernel_type_cast.bkr type_cast 46
          run_stage2_bkrc_fixture tests/37_kernel_string_concat.bkr string_concat 11
          run_stage2_bkrc_fixture tests/38_kernel_while_loop.bkr while_loop 55
          run_stage2_bkrc_fixture tests/39_kernel_while_break.bkr while_break 15
          run_stage2_bkrc_fixture tests/40_kernel_bitwise_ops.bkr bitwise_ops 42
          run_stage2_bkrc_fixture tests/41_kernel_len_builtin.bkr len_builtin 15
          run_stage2_bkrc_fixture tests/42_kernel_ternary.bkr ternary 42
          run_stage2_bkrc_fixture tests/43_kernel_modulo.bkr modulo 42
          run_stage2_bkrc_fixture tests/44_kernel_unary_neg.bkr unary_neg 42
          run_stage2_bkrc_fixture tests/45_kernel_nested_calls.bkr nested_calls 42
          run_stage2_bkrc_fixture tests/46_kernel_struct_ops.bkr struct_ops 42
          run_stage2_bkrc_fixture tests/47_kernel_array_ops.bkr array_ops 42
          run_stage2_bkrc_fixture tests/49_kernel_bool_logic.bkr bool_logic 42
          run_stage2_bkrc_fixture tests/50_kernel_recursive_gcd.bkr recursive_gcd 42
          run_stage2_bkrc_fixture tests/51_kernel_comparisons.bkr comparisons 42
          run_stage2_bkrc_fixture tests/52_kernel_option_match.bkr option_match 42
          run_stage2_bkrc_fixture tests/53_kernel_float_ops.bkr float_ops 42
          run_stage2_bkrc_fixture tests/54_kernel_i64_ops.bkr i64_ops 42
          run_stage2_bkrc_fixture tests/55_kernel_const.bkr consts 42
          run_stage2_bkrc_fixture tests/48_kernel_control_flow.bkr control_flow 42
          run_stage2_bkrc_fixture tests/56_kernel_early_return.bkr early_return 42
          run_stage2_bkrc_fixture tests/57_kernel_multiple_structs.bkr multiple_structs 42
          run_stage2_bkrc_fixture tests/63_arena_loop_reuse.bkr arena_loop_reuse 42
          run_stage2_bkrc_fixture tests/64_arena_nested_blocks.bkr arena_nested_blocks 42
          run_stage2_bkrc_fixture tests/65_arena_if_branches.bkr arena_if_branches 42
          run_stage2_bkrc_fixture tests/72_file_io.bkr file_io 42
          run_stage2_bkrc_fixture tests/73_string_methods.bkr string_methods 42
          run_stage2_bkrc_fixture tests/74_vec_operations.bkr vec_operations 42
          run_stage2_bkrc_fixture tests/75_result_type.bkr result_type 42
          run_stage2_bkrc_fixture tests/76_hashmap_operations.bkr hashmap_operations 42
          run_stage2_bkrc_fixture tests/77_typed_vec_operations.bkr typed_vec_operations 42
          run_stage2_bkrc_fixture tests/79_typed_result_operations.bkr typed_result_ops 42
          run_stage2_bkrc_fixture tests/81_typed_hashmap_operations.bkr typed_hashmap_operations 42
          run_stage2_bkrc_fixture tests/85_result_handle_roundtrip.bkr result_handle_roundtrip 42
          run_stage2_bkrc_fixture tests/99_incremental_1.bkr incremental_1 42
          run_stage2_bkrc_fixture tests/99_incremental_2.bkr incremental_2 42

          mkdir -p self-host-artifacts
          cp /tmp/bkrc.c self-host-artifacts/bkrc-stage1.c
          cp /tmp/bkrc self-host-artifacts/bkrc-stage1
          cp "$self_compile_dir/self_host_output.c" self-host-artifacts/bkrc-stage2.c
          cp "$self_compile_dir/bkrc2" self-host-artifacts/bkrc-stage2
          cp self-host/runtime.h self-host-artifacts/runtime.h

      - name: Upload self-host compiler artifacts
        uses: actions/upload-artifact@v4
        with:
          name: self-host-bkrc-ubuntu
          if-no-files-found: error
          path: self-host-artifacts/

  self-host-incremental-canary:
    name: Self-host incremental canary
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Build release compiler
        working-directory: bunker-cli
        run: cargo build --release

      - name: Compile incremental parser fixture under resource caps
        timeout-minutes: 3
        run: |
          ulimit -v 1500000
          timeout --kill-after=5s 120s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/99_incremental_1.bkr \
            -o /tmp/99_incremental_1.c

      - name: Compile incremental codegen fixture under resource caps
        timeout-minutes: 3
        run: |
          ulimit -v 1500000
          timeout --kill-after=5s 120s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/99_incremental_2.bkr \
            -o /tmp/99_incremental_2.c
