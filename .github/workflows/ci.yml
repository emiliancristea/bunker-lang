name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-action@stable
      with:
        toolchain: ${{ matrix.rust }}

    - name: Build
      working-directory: bunker-cli
      run: cargo build --verbose

    - name: Run tests
      working-directory: bunker-cli
      run: cargo test --verbose

    - name: Build release
      working-directory: bunker-cli
      run: cargo build --release --verbose

    - name: Check formatting
      working-directory: bunker-cli
      run: cargo fmt -- --check
      if: matrix.os == 'ubuntu-latest'

    - name: Clippy
      working-directory: bunker-cli
      run: cargo clippy -- -D warnings
      if: matrix.os == 'ubuntu-latest'

  test-bkr-files:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-action@stable

    - name: Build compiler
      working-directory: bunker-cli
      run: cargo build --release

    - name: Test all .bkr files
      run: |
        for f in tests/*.bkr; do
          echo "Checking $f..."
          ./bunker-cli/target/release/bunker-cli check "$f"
        done

    - name: Compile all .bkr files
      run: |
        for f in tests/*.bkr; do
          echo "Compiling $f..."
          ./bunker-cli/target/release/bunker-cli build "$f" -o "${f%.bkr}.o"
        done
