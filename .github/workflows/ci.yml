          for file in self-host/modules/ast_report.bkr self-host/modules/c_codegen.bkr self-host/modules/resolver.bkr self-host/modules/symbol_table.bkr; do
            grep -n 'ast_pattern_from_ref(' "$file" >> "$matches" || true
