          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          matches="$(mktemp)"
          grep -n -E 'let node: Vec<i64> = ast_new\(|return ast_new\(NODE_' "$ast" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "AST constructors must route through typed Ast*Ref helpers."
            cat "$matches"
            exit 1
          fi
          grep -n 'return ast_block_stmt_count(ast_block_node_from_ref(block_ref))' "$ast" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Typed block count helper must not recurse through the raw adapter."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'let node_ref = ast_node_ref_new|let block_ref = ast_block_ref|let stmt = ast_stmt_node_from_ref' "$ast" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Typed AST constructor locals must carry explicit types for stage2 codegen."
            cat "$matches"
            exit 1
          fi

  self-host-smoke:
    name: Self-host smoke inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Build release compiler
        working-directory: bunker-cli
        run: cargo build --release

      - name: Check self-host compiler sources
        timeout-minutes: 2
        run: ./bunker-cli/target/release/bunker-cli self-host-check self-host

      - name: Compile basic fixture through self-host compiler
        timeout-minutes: 2
        run: |
          timeout --kill-after=5s 60s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/01_basic_math.bkr \
            -o /tmp/01_basic_math.c
          test -s /tmp/01_basic_math.c
          grep -q "BUNKER_CAPABILITY_JSON" /tmp/01_basic_math.c
          grep -q "bunker.self_host.capability.v1" /tmp/01_basic_math.c
          grep -q '"source_byte_spans":true' /tmp/01_basic_math.c
          grep -q '"type_graph_report":true' /tmp/01_basic_math.c
          grep -q '"symbol_table_report":true' /tmp/01_basic_math.c
          grep -q '"name_resolver_report":true' /tmp/01_basic_math.c
          grep -q '"typecheck_report":true' /tmp/01_basic_math.c
          grep -q '"typed_ast":false' /tmp/01_basic_math.c
          grep -q "BUNKER_AST_JSON" /tmp/01_basic_math.c
          grep -q "bunker.self_host.ast.v1" /tmp/01_basic_math.c
          grep -q '"complete_tree":true' /tmp/01_basic_math.c
          grep -q '"tree":{"kind":"kernel"' /tmp/01_basic_math.c
          grep -q '"statements":' /tmp/01_basic_math.c
          grep -q '"return_type":' /tmp/01_basic_math.c
          grep -q '"item_count":2' /tmp/01_basic_math.c
          grep -q '"function_count":2' /tmp/01_basic_math.c
          grep -q "BUNKER_TYPE_GRAPH_JSON" /tmp/01_basic_math.c
          grep -q "bunker.self_host.type_graph.v1" /tmp/01_basic_math.c
          grep -q '"complete":false' /tmp/01_basic_math.c
          grep -q '"declared_types":true' /tmp/01_basic_math.c
          grep -q '"functions":' /tmp/01_basic_math.c
          grep -q '"locals":' /tmp/01_basic_math.c
          grep -q '"effective_type":' /tmp/01_basic_math.c
          grep -q "BUNKER_SYMBOL_TABLE_JSON" /tmp/01_basic_math.c
          grep -q "bunker.self_host.symbol_table.v1" /tmp/01_basic_math.c
          grep -q '"declaration_table":' /tmp/01_basic_math.c
          grep -q '"reference_table":' /tmp/01_basic_math.c
          grep -q '"resolver_report":"BUNKER_RESOLVER_JSON"' /tmp/01_basic_math.c
          grep -q '"kind":"function"' /tmp/01_basic_math.c
          grep -q '"kind":"local"' /tmp/01_basic_math.c
          grep -q '"kind":"function_call"' /tmp/01_basic_math.c
          grep -q "BUNKER_RESOLVER_JSON" /tmp/01_basic_math.c
          grep -q "bunker.self_host.resolver.v1" /tmp/01_basic_math.c
          grep -q '"duplicate_detection":true' /tmp/01_basic_math.c
          grep -q '"unresolved_detection":true' /tmp/01_basic_math.c
          grep -q '"has_diagnostics":false' /tmp/01_basic_math.c
          grep -q "BUNKER_TYPECHECK_JSON" /tmp/01_basic_math.c
          grep -q "bunker.self_host.typecheck.v1" /tmp/01_basic_math.c
          grep -q '"annotation_checks":true' /tmp/01_basic_math.c
          grep -q '"return_checks":true' /tmp/01_basic_math.c
          grep -q '"condition_checks":true' /tmp/01_basic_math.c
          grep -q '"call_argument_checks":true' /tmp/01_basic_math.c
          grep -q 'BUNKER_TYPECHECK_JSON: .*"has_diagnostics":false' /tmp/01_basic_math.c
          cp self-host/runtime.h /tmp/runtime.h
          cc -std=c11 /tmp/01_basic_math.c -o /tmp/01_basic_math
          set +e
          timeout --kill-after=5s 60s /tmp/01_basic_math
          status=$?
          set -e
          echo "01_basic_math exited $status, expected 42"
          test "$status" -eq 42

      - name: Check self-host resolver diagnostics
        timeout-minutes: 2
        run: |
          cat > /tmp/resolver_bad.bkr <<'BKR'
          kernel Broken {
              struct Pair { left: i32, left: i32 }

              fn main(x: i32, x: i32) -> i32 {
                  let y: i32 = 1;
                  let y: Missing = missing_fn(nope);
                  let p: Pair = Pair { left: y, right: 2 };
                  return nope;
              }
          }
          BKR
          timeout --kill-after=5s 60s ./bunker-cli/target/release/bunker-cli self-host-compile \
            /tmp/resolver_bad.bkr \
            -o /tmp/resolver_bad.c
          test -s /tmp/resolver_bad.c
          ! grep -q "Parse error" /tmp/resolver_bad.c
          grep -q "BUNKER_CAPABILITY_JSON" /tmp/resolver_bad.c
          grep -q '"name_resolver_report":true' /tmp/resolver_bad.c
          grep -q "BUNKER_RESOLVER_JSON" /tmp/resolver_bad.c
          grep -q "bunker.self_host.resolver.v1" /tmp/resolver_bad.c
          grep -q '"has_diagnostics":true' /tmp/resolver_bad.c
          grep -q '"diagnostic_count":' /tmp/resolver_bad.c
          grep -q "BKR_SELF_DUPLICATE_SYMBOL" /tmp/resolver_bad.c
          grep -q "BKR_SELF_UNRESOLVED_SYMBOL" /tmp/resolver_bad.c
          grep -q '"name":"missing_fn"' /tmp/resolver_bad.c
          grep -q '"name":"nope"' /tmp/resolver_bad.c
          grep -q '"name":"Missing"' /tmp/resolver_bad.c
          grep -q '"name":"right"' /tmp/resolver_bad.c

      - name: Check self-host typecheck diagnostics
        timeout-minutes: 2
        run: |
          cat > /tmp/typecheck_bad.bkr <<'BKR'
          kernel TypeBroken {
              fn add(x: i32, y: i32) -> i32 {
                  return x + y;
              }

              fn flag() -> bool {
                  return 1;
              }

              fn main() -> i32 {
                  let text: str = 42;
                  let ok: i32 = add(true, 2);
                  if 1 {
                      return text;
                  }
                  return false;
              }
          }
          BKR
          timeout --kill-after=5s 60s ./bunker-cli/target/release/bunker-cli self-host-compile \
            /tmp/typecheck_bad.bkr \
            -o /tmp/typecheck_bad.c
          test -s /tmp/typecheck_bad.c
          ! grep -q "Parse error" /tmp/typecheck_bad.c
          grep -q "BUNKER_CAPABILITY_JSON" /tmp/typecheck_bad.c
          grep -q '"typecheck_report":true' /tmp/typecheck_bad.c
          grep -q "BUNKER_TYPECHECK_JSON" /tmp/typecheck_bad.c
          grep -q "bunker.self_host.typecheck.v1" /tmp/typecheck_bad.c
          grep -q 'BUNKER_TYPECHECK_JSON: .*"has_diagnostics":true' /tmp/typecheck_bad.c
          grep -q '"diagnostic_count":' /tmp/typecheck_bad.c
          grep -q "BKR_SELF_TYPE_MISMATCH" /tmp/typecheck_bad.c
          grep -q "annotation_type_mismatch" /tmp/typecheck_bad.c
          grep -q "return_type_mismatch" /tmp/typecheck_bad.c
          grep -q "condition_type_mismatch" /tmp/typecheck_bad.c
          grep -q "call_argument_type_mismatch" /tmp/typecheck_bad.c
          grep -q '"name":"text"' /tmp/typecheck_bad.c
          grep -q '"name":"add"' /tmp/typecheck_bad.c
          grep -q '"expected":"str"' /tmp/typecheck_bad.c
          grep -q '"expected":"bool"' /tmp/typecheck_bad.c
          grep -q '"found":"i64"' /tmp/typecheck_bad.c
          grep -q '"found":"bool"' /tmp/typecheck_bad.c

      - name: Compile branching fixture through self-host compiler
        timeout-minutes: 2
        run: |
          timeout --kill-after=5s 60s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/14_kernel_if_branching.bkr \
            -o /tmp/14_kernel_if_branching.c
          test -s /tmp/14_kernel_if_branching.c
          cp self-host/runtime.h /tmp/runtime.h
          cc -std=c11 /tmp/14_kernel_if_branching.c -o /tmp/14_kernel_if_branching
          set +e
          timeout --kill-after=5s 60s /tmp/14_kernel_if_branching
          status=$?
          set -e
          echo "14_kernel_if_branching exited $status, expected 42"
          test "$status" -eq 42

      - name: Compile incremental parser fixture through self-host compiler
        timeout-minutes: 3
        run: |
          timeout --kill-after=5s 120s ./bunker-cli/target/release/bunker-cli self-host-compile \
            tests/99_incremental_1.bkr \
            -o /tmp/99_incremental_1.c
          test -s /tmp/99_incremental_1.c
          ! grep -q "Parse error" /tmp/99_incremental_1.c
          cp self-host/runtime.h /tmp/runtime.h
          cc -std=c11 /tmp/99_incremental_1.c -o /tmp/99_incremental_1
          set +e
          timeout --kill-after=5s 60s /tmp/99_incremental_1
          status=$?
          set -e
          echo "99_incremental_1 exited $status, expected 42"
          test "$status" -eq 42

      - name: Compile incremental codegen fixture through self-host compiler
        timeout-minutes: 3
        run: |
