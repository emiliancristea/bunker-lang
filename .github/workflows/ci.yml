name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: rustup default ${{ matrix.rust }}

      - name: Build
        working-directory: bunker-cli
        run: cargo build --verbose

      - name: Run Rust tests
        working-directory: bunker-cli
        run: cargo test --verbose

      - name: Build release
        working-directory: bunker-cli
        run: cargo build --release --verbose

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: bunker-cli-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            bunker-cli/target/release/bunker-cli
            bunker-cli/target/release/bunker-cli.exe

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        working-directory: bunker-cli
        run: cargo fmt -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        working-directory: bunker-cli
        run: cargo clippy -- -D warnings

  bunker-tests:
    name: Bunker language tests
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Build release compiler
        working-directory: bunker-cli
        run: cargo build --release

      - name: Run Bunker test suite
        shell: pwsh
        run: ./run_tests.ps1 -Verbose

  self-host-boundaries:
    name: Self-host boundary guards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Prevent raw AST collection traversal outside AST boundary
        shell: bash
        run: |
          set -euo pipefail
          pattern='ast_kernel_item_count\(|ast_kernel_item\(|ast_fn_param_count\(|ast_fn_param\(|ast_struct_field_count\(|ast_struct_field\(|ast_call_arg_count\(|ast_call_arg_handle\(|ast_array_element_count\(|ast_array_element_handle\(|ast_match_arm_count\(|ast_match_body_handle\(|ast_struct_lit_field_count\(|ast_struct_lit_field_name_idx\(|ast_struct_lit_field_value_handle\(|ast_pattern_list_get_ref\(ast_match_patterns|ast_node_list_get_ref\(ast_fn_params\(|ast_node_list_get_ref\(ast_struct_fields\('
          matches="$(mktemp)"
          grep -R -n -E "$pattern" self-host --include='*.bkr' | grep -v '^self-host/modules/ast\.bkr:' > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Raw AST collection traversal must stay inside self-host/modules/ast.bkr."
            cat "$matches"
            exit 1
          fi

      - name: Require parser start spans through typed AST refs
        shell: bash
        run: |
          set -euo pipefail
          parser='self-host/modules/parser.bkr'
          ast='self-host/modules/ast.bkr'
          grep -q 'fn parser_set_node_ref_span_from_start(p: ParserStateRef, node_ref: AstNodeRef, start: i64) -> AstNodeRef' "$parser"
          grep -q 'fn parser_set_node_ref_span(node_ref: AstNodeRef, start: i64, end: i64) -> AstNodeRef' "$parser"
          grep -q 'fn parser_set_type_ref_span_from_start(p: ParserStateRef, type_ref: AstTypeRef, start: i64) -> AstTypeRef' "$parser"
          grep -q 'fn parser_set_expr_ref_span_from_start(p: ParserStateRef, expr_ref: AstExprRef, start: i64) -> AstExprRef' "$parser"
          grep -q 'fn parser_set_expr_ref_span(expr_ref: AstExprRef, start: i64, end: i64) -> AstExprRef' "$parser"
          grep -q 'fn parser_set_stmt_ref_span_from_start(p: ParserStateRef, stmt_ref: AstStmtRef, start: i64) -> AstStmtRef' "$parser"
          grep -q 'fn parser_set_stmt_ref_span(stmt_ref: AstStmtRef, start: i64, end: i64) -> AstStmtRef' "$parser"
          grep -q 'fn parser_set_item_ref_span_from_start(p: ParserStateRef, item_ref: AstItemRef, start: i64) -> AstItemRef' "$parser"
          grep -q 'fn parser_set_block_ref_span_from_start(p: ParserStateRef, block_ref: AstBlockRef, start: i64) -> AstBlockRef' "$parser"
          grep -q 'fn parser_set_pattern_ref_span_from_start(p: ParserStateRef, pattern_ref: AstPatternRef, start: i64) -> AstPatternRef' "$parser"
          matches="$(mktemp)"
          grep -n -E 'return ast_set_span\(node, start, parser_end_for_span|return ast_set_pattern_span\(pattern, start, parser_end_for_span' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser start-span adapters must route through typed AstNodeRef/AstPatternRef helpers."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'parser_set_node_span_from_start\(p, ast_(type|type_array|type_struct|match|int_lit|float_lit|bool_lit|str_lit|array_lit|struct_lit|call|ident|unary)\(|parser_set_pattern_span_from_start\(p, ast_pattern\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser primary/type/pattern construction must route through typed Ast*Ref constructors."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'ast_(index|field_access|binary|ternary|assign|expr_stmt)\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser postfix/operator/assignment construction must route through typed Ast*Ref constructors."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'parser_set_node_span_from_start\(p, ast_(let|return|break|continue)\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser simple-statement construction must route through typed AstStmtRef constructors."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'ast_(if|for|while|loop)\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser control-flow construction must route through typed AstStmtRef constructors."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'ast_(param|field_decl)\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser param/field construction must route through typed AstNodeRef constructors."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'parser_set_node_span_from_start\(p, ast_(fn|const|struct)\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser item construction must route through typed AstItemRef constructors."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'parser_set_node_span_from_start\(p, ast_kernel\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser kernel construction must route through typed AstNodeRef constructors."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn ast_node_list_append_expr_ref(nodes_ref: AstNodeListRef, expr_ref: AstExprRef) -> AstNodeListRef' "$ast"
          grep -q 'fn ast_node_list_append_item_ref(nodes_ref: AstNodeListRef, item_ref: AstItemRef) -> AstNodeListRef' "$ast"
          grep -n -E 'ast_node_list_append\(|ast_node_list_append_ref\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser node-list appends must use typed AST node-list append refs."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'ast_block\(|ast_block_append\(|ast_block_with\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser block construction must route through typed AstBlockRef helpers."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'ast_block_(ref_from_node|handle)\(parse_block\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser block consumers must use parse_block_ref instead of raw parse_block adapters."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'ast_stmt_ref_from_node\(parse_(let|return|simple|if|for)_stmt\(|let [A-Za-z0-9_]+: Vec<i64> = parse_(let|return|simple|if|for)_stmt\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser statement consumers must use parse_*_stmt_ref helpers instead of raw statement wrappers."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parse_params_ref(p: ParserStateRef) -> AstNodeListRef' "$parser"
          grep -q 'fn parse_fn_ref(p: ParserStateRef) -> AstItemRef' "$parser"
          grep -q 'fn parse_const_ref(p: ParserStateRef) -> AstItemRef' "$parser"
          grep -q 'fn parse_struct_ref(p: ParserStateRef) -> AstItemRef' "$parser"
          grep -n -E 'parse_params\(p\);|parse_(fn|const|struct)\(p\);|let [A-Za-z0-9_]+: Vec<i64> = parse_(params|fn|const|struct)\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser param/item consumers must use typed parse_*_ref helpers instead of raw wrappers."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parse_expr_ref(p: ParserStateRef) -> AstExprRef' "$parser"
          grep -n -E 'parse_expr\(p\);|ast_expr_ref_from_node\(parse_expr\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser expression consumers must use parse_expr_ref instead of raw parse_expr nodes."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parse_type_ref(p: ParserStateRef) -> AstTypeRef' "$parser"
          grep -n -E 'parse_type\(p\);|ast_type_ref_from_node\(parse_type\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser type consumers must use parse_type_ref instead of raw parse_type nodes."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parse_match_pattern_ref(p: ParserStateRef) -> AstPatternRef' "$parser"
          grep -n 'parse_match_pattern(p);' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser pattern consumers must use parse_match_pattern_ref instead of raw parse_match_pattern nodes."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'ast_pattern_list_append\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser pattern-list consumers must use typed pattern-list append helpers."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parse_match_expr_ref(p: ParserStateRef) -> AstExprRef' "$parser"
          grep -q 'fn parse_atom_ref(p: ParserStateRef) -> AstExprRef' "$parser"
          grep -n -E 'parse_(match_expr|atom)\(p\);' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser atom consumers must use parse_match_expr_ref/parse_atom_ref instead of raw atom wrappers."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parse_postfix_ref(p: ParserStateRef) -> AstExprRef' "$parser"
          grep -n -E 'parse_postfix\(p\);|ast_expr_ref_from_node\(parse_postfix\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser postfix consumers must use parse_postfix_ref instead of raw postfix wrappers."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parse_mul_ref(p: ParserStateRef) -> AstExprRef' "$parser"
          grep -n -E 'parse_mul\(p\);|ast_expr_ref_from_node\(parse_mul\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser multiplicative consumers must use parse_mul_ref instead of raw parse_mul wrappers."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parse_add_ref(p: ParserStateRef) -> AstExprRef' "$parser"
          grep -n -E 'parse_add\(p\);|ast_expr_ref_from_node\(parse_add\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser additive consumers must use parse_add_ref instead of raw parse_add wrappers."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parse_shift_ref(p: ParserStateRef) -> AstExprRef' "$parser"
          grep -n -E 'parse_shift\(p\);|ast_expr_ref_from_node\(parse_shift\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser shift consumers must use parse_shift_ref instead of raw parse_shift wrappers."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parse_bit_and_ref(p: ParserStateRef) -> AstExprRef' "$parser"
          grep -n -E 'parse_bit_and\(p\);|ast_expr_ref_from_node\(parse_bit_and\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser bitwise-and consumers must use parse_bit_and_ref instead of raw parse_bit_and wrappers."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parse_bit_xor_ref(p: ParserStateRef) -> AstExprRef' "$parser"
          grep -n -E 'parse_bit_xor\(p\);|ast_expr_ref_from_node\(parse_bit_xor\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser bitwise-xor consumers must use parse_bit_xor_ref instead of raw parse_bit_xor wrappers."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parse_bit_or_ref(p: ParserStateRef) -> AstExprRef' "$parser"
          grep -n -E 'parse_bit_or\(p\);|ast_expr_ref_from_node\(parse_bit_or\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser bitwise-or consumers must use parse_bit_or_ref instead of raw parse_bit_or wrappers."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parse_comparison_ref(p: ParserStateRef) -> AstExprRef' "$parser"
          grep -n -E 'parse_comparison\(p\);|ast_expr_ref_from_node\(parse_comparison\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser comparison consumers must use parse_comparison_ref instead of raw parse_comparison wrappers."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parse_and_ref(p: ParserStateRef) -> AstExprRef' "$parser"
          grep -n -E 'parse_and\(p\);|ast_expr_ref_from_node\(parse_and\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser logical-and consumers must use parse_and_ref instead of raw parse_and wrappers."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parse_or_ref(p: ParserStateRef) -> AstExprRef' "$parser"
          grep -n -E 'parse_or\(p\);|ast_expr_ref_from_node\(parse_or\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser logical-or consumers must use parse_or_ref instead of raw parse_or wrappers."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parse_ternary_ref(p: ParserStateRef) -> AstExprRef' "$parser"
          grep -n -E 'parse_ternary\(p\);|ast_expr_ref_from_node\(parse_ternary\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser ternary consumers must use parse_ternary_ref instead of raw parse_ternary wrappers."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn ast_expr_ref_span_start(expr_ref: AstExprRef) -> i64' "$ast"
          grep -q 'fn ast_expr_ref_span_end(expr_ref: AstExprRef) -> i64' "$ast"
          grep -n -E 'let [A-Za-z_][A-Za-z0-9_]*: Vec<i64> = ast_expr_node_from_ref|ast_node_span_(start|end)\(ast_expr_node_from_ref\(' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser expression spans must use typed AstExprRef span helpers."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parser_expr_ref_to_compat_node(expr_ref: AstExprRef) -> Vec<i64>' "$parser"
          grep -n 'ast_expr_node_from_ref(' "$parser" | grep -v 'return ast_expr_node_from_ref(expr_ref);' > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser raw expression-node conversion must stay inside parser_expr_ref_to_compat_node."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'return ast_expr_node_from_ref\(parse_(match_expr|atom|postfix|mul|add|shift|bit_and|bit_xor|bit_or|comparison|and|or|ternary|expr)_ref\(p\)\);' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser raw expression wrappers must route through parser_expr_ref_to_compat_node."
            cat "$matches"
            exit 1
          fi
          grep -q 'fn parser_node_ref_to_compat_node(node_ref: AstNodeRef) -> Vec<i64>' "$parser"
          grep -q 'fn parser_type_ref_to_compat_node(type_ref: AstTypeRef) -> Vec<i64>' "$parser"
          grep -q 'fn parser_stmt_ref_to_compat_node(stmt_ref: AstStmtRef) -> Vec<i64>' "$parser"
          grep -q 'fn parser_item_ref_to_compat_node(item_ref: AstItemRef) -> Vec<i64>' "$parser"
          grep -q 'fn parser_block_ref_to_compat_node(block_ref: AstBlockRef) -> Vec<i64>' "$parser"
          grep -q 'fn parser_pattern_ref_to_compat_pattern(pattern_ref: AstPatternRef) -> Vec<i64>' "$parser"
          grep -q 'fn parser_node_list_ref_to_compat_list(nodes_ref: AstNodeListRef) -> Vec<i64>' "$parser"
          grep -n -E 'ast_(node|type_node|expr_node|stmt_node|item_node|block_node|pattern|node_list)_from_ref\(' "$parser" \
            | grep -v 'return ast_node_from_ref(node_ref);' \
            | grep -v 'return ast_type_node_from_ref(type_ref);' \
            | grep -v 'return ast_expr_node_from_ref(expr_ref);' \
            | grep -v 'return ast_stmt_node_from_ref(stmt_ref);' \
            | grep -v 'return ast_item_node_from_ref(item_ref);' \
            | grep -v 'return ast_block_node_from_ref(block_ref);' \
            | grep -v 'return ast_pattern_from_ref(pattern_ref);' \
            | grep -v 'return ast_node_list_from_ref(nodes_ref);' > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser raw compatibility exits must stay inside named parser_*_to_compat_* helpers."
            cat "$matches"
            exit 1
          fi
          grep -n -E 'return ast_(type_node|stmt_node|item_node|block_node|node_list|pattern)_from_ref\(parse_|return ast_node_from_ref\(parser_set_node_ref_span_from_start' "$parser" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Parser raw wrappers must route through named parser compatibility helpers."
            cat "$matches"
            exit 1
          fi
      - name: Require C codegen top-level AST refs
        shell: bash
        run: |
          set -euo pipefail
          ast='self-host/modules/ast.bkr'
          cgen='self-host/modules/c_codegen.bkr'
          grep -q 'fn ast_fn_ref_params_ref(item_ref: AstItemRef) -> AstNodeListRef' "$ast"
          grep -q 'fn ast_node_list_ref_get_item_ref(nodes_ref: AstNodeListRef, index: i64) -> AstItemRef' "$ast"
          grep -q 'fn ast_kernel_ref_items_ref(node_ref: AstNodeRef) -> AstNodeListRef' "$ast"
          matches="$(mktemp)"
          grep -n -E 'ast_item_node_from_ref\(|ast_node_from_ref\(kernel_ref\)|ast_node_from_ref\(param_ref\)|ast_node_from_ref\(field_ref\)|ast_fn_params_ref\(|ast_struct_fields_ref\(|ast_kernel_items_ref\(|ast_kernel_names\(|ast_kernel_entry_idx\(' "$cgen" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "C codegen top-level item/kernel paths must use typed AST ref accessors."
            cat "$matches"
            exit 1
          fi

      - name: Require C codegen statement AST refs
        shell: bash
        run: |
          set -euo pipefail
          cgen='self-host/modules/c_codegen.bkr'
          matches="$(mktemp)"
          grep -n -E 'ast_stmt_node_from_ref\(|ast_block_node_from_ref\(|ast_block_stmt\(|ast_let_name_idx\(|ast_let_type_handle\(|ast_let_init_handle\(|ast_if_cond_handle\(|ast_if_then\(|ast_if_else_handle\(|ast_while_cond_handle\(|ast_while_body\(|ast_for_name_idx\(|ast_for_start_handle\(|ast_for_end_handle\(|ast_for_inclusive\(|ast_for_body\(|ast_loop_body\(|ast_return_expr_handle\(|ast_assign_target_handle\(|ast_assign_value_handle\(|ast_expr_stmt_expr_handle\(' "$cgen" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "C codegen statement/block paths must use typed AST ref accessors."
            cat "$matches"
            exit 1
          fi

      - name: Require C codegen expression AST refs
        shell: bash
        run: |
          set -euo pipefail
          cgen='self-host/modules/c_codegen.bkr'
          matches="$(mktemp)"
          grep -n -E 'ast_expr_node_from_ref\(|ast_name_idx\(|ast_call_name_idx\(|ast_call_args_ref\(|ast_binary_op\(|ast_binary_left_handle\(|ast_binary_right_handle\(|ast_unary_op\(|ast_unary_operand_handle\(|ast_ternary_cond_handle\(|ast_ternary_then_handle\(|ast_ternary_else_handle\(|ast_array_elements_ref\(|ast_index_base_handle\(|ast_index_expr_handle\(|ast_match_scrutinee_handle\(|ast_match_patterns_ref\(|ast_match_bodies_ref\(|ast_field_base_handle\(|ast_field_name_idx\(|ast_struct_lit_name_idx\(|ast_struct_lit_field_names_ref\(|ast_struct_lit_field_values_ref\(|ast_value\(' "$cgen" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "C codegen expression paths must use typed AST ref accessors."
            cat "$matches"
            exit 1
          fi

      - name: Require symbol-table top-level AST refs
        shell: bash
        run: |
          set -euo pipefail
          sym='self-host/modules/symbol_table.bkr'
          matches="$(mktemp)"
          grep -n -E 'ast_item_node_from_ref\(|ast_node_from_ref\(kernel_ref\)|ast_node_from_ref\(param_ref\)|ast_node_from_ref\(field_ref\)|ast_fn_params_ref\(|ast_struct_fields_ref\(|ast_kernel_items_ref\(|ast_kernel_names\(|ast_fn_body\(|ast_fn_name_idx\(|ast_const_name_idx\(|ast_struct_name_idx\(|ast_param_name_idx\(|ast_field_decl_name_idx\(' "$sym" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Symbol-table top-level item/kernel paths must use typed AST ref accessors."
            cat "$matches"
            exit 1
          fi

      - name: Require resolver top-level AST refs
        shell: bash
        run: |
          set -euo pipefail
          resolver='self-host/modules/resolver.bkr'
          matches="$(mktemp)"
          grep -n -E 'ast_item_node_from_ref\(|ast_node_from_ref\(kernel_ref\)|ast_node_from_ref\(param_ref\)|ast_node_from_ref\(field_ref\)|ast_fn_params_ref\(|ast_struct_fields_ref\(|ast_kernel_items_ref\(|ast_kernel_names\(|ast_fn_body\(|ast_fn_name_idx\(|ast_const_name_idx\(|ast_struct_name_idx\(|ast_param_name_idx\(|ast_field_decl_name_idx\(' "$resolver" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Resolver top-level item/kernel paths must use typed AST ref accessors."
            cat "$matches"
            exit 1
          fi

      - name: Require type-graph top-level AST refs
        shell: bash
        run: |
          set -euo pipefail
          type_graph='self-host/modules/type_graph.bkr'
          matches="$(mktemp)"
          grep -n -E 'ast_item_node_from_ref\(|ast_node_from_ref\(kernel_ref\)|ast_node_from_ref\(param_ref\)|ast_node_from_ref\(field_ref\)|ast_fn_params_ref\(|ast_struct_fields_ref\(|ast_kernel_items_ref\(|ast_kernel_names\(|ast_fn_body\(|ast_fn_name_idx\(|ast_fn_return_type_handle\(|ast_const_name_idx\(|ast_const_type_handle\(|ast_const_value_handle\(|ast_struct_name_idx\(|ast_param_name_idx\(|ast_field_decl_name_idx\(' "$type_graph" > "$matches" || true
          if [ -s "$matches" ]; then
            echo "Type-graph top-level item/kernel paths must use typed AST ref accessors."
            cat "$matches"
            exit 1
          fi

      - name: Require type-graph statement AST refs
        shell: bash
        run: |
          set -euo pipefail
          type_graph='self-host/modules/type_graph.bkr'
          matches="$(mktemp)"
